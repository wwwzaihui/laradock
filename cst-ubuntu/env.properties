# MISE
MISE_GO_DEFAULT_URL_TEMPLATE="https://golang.google.cn/dl/go{{version}}.{{os}}-{{arch}}.tar.gz"

GITHUB_MIRROR="https://gitee.com/mirrors/python-build-standalone"
MISE_JAVA_MIRROR="https://mirrors.aliyun.com/adoptium/temurin/"
MISE_NODE_MIRROR="https://npmmirror.com/mirrors/node/"
MISE_GO_REPO="https://gitee.com/mirrors/go"

# Rust Cargo 镜像加速（rsproxy）
CARGO_REGISTRIES_RSPROXY_INDEX="sparse+https://rsproxy.cn/crates.io-index/"
CARGO_REGISTRIES_CRATES_IO_REPLACE_WITH="rsproxy"

# ===== set brew =====
HOMEBREW_GITHUB_API_TOKEN=
HOMEBREW_INSTALL_FROM_API=1
HOMEBREW_API_DOMAIN="https://mirrors.tuna.tsinghua.edu.cn/homebrew-bottles/api"
HOMEBREW_BOTTLE_DOMAIN="https://mirrors.tuna.tsinghua.edu.cn/homebrew-bottles"
HOMEBREW_BREW_GIT_REMOTE="https://mirrors.tuna.tsinghua.edu.cn/git/homebrew/brew.git"
HOMEBREW_CORE_GIT_REMOTE="https://mirrors.tuna.tsinghua.edu.cn/git/homebrew/homebrew-core.git"
HOMEBREW_NO_AUTO_UPDATE=1
HOMEBREW_NO_INSTALL_CLEANUP=1


# ===== set rust =====
# RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup
#RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static
RUSTUP_DIST_SERVER="https://rsproxy.cn/"
RUSTUP_UPDATE_ROOT="https://rsproxy.cn/rustup/"
CARGO_REGISTRIES_CRATES_IO_INDEX=https://mirrors.ustc.edu.cn/crates.io-index
# Rust Cargo 镜像加速（rsproxy）
CARGO_REGISTRIES_RSPROXY_INDEX="sparse+https://rsproxy.cn/crates.io-index/"
CARGO_REGISTRIES_CRATES_IO_REPLACE_WITH="rsproxy"

# NODE
npm_mirror=https://npmmirror.com/mirrors/npm/
node_mirror=https://npmmirror.com/mirrors/node/
NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node/

# GIT
GCM_CREDENTIAL_STORE=plaintext

# python
UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple"
PYTHON_BUILD_MIRROR_URL=https://mirrors.aliyun.com/python/
PIP_INDEX_URL=https://npmmirror.com/mirrors/pypi/

# Ensure mise shims are on PATH so node/python are available without sourcing bashrc
PATH=/root/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin