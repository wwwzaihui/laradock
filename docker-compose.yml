      - JVM_XMX=${NACOS_JVM_XMX}
      - JVM_XMN=${NACOS_JVM_XMN}
      - JVM_MS=${NACOS_JVM_MS}
      - JVM_MMS=${NACOS_JVM_MMS}
      - SPRING_DATASOURCE_PLATFORM=${NACOS_SPRING_DATASOURCE_PLATFORM}
      - MYSQL_SERVICE_HOST=${NACOS_MYSQL_SERVICE_HOST}
      - MYSQL_SERVICE_PORT=${NACOS_MYSQL_SERVICE_PORT}
      - MYSQL_SERVICE_DB_NAME=${NACOS_MYSQL_SERVICE_DB_NAME}
      - MYSQL_SERVICE_USER=${NACOS_MYSQL_SERVICE_USER}
      - MYSQL_SERVICE_PASSWORD=${NACOS_MYSQL_SERVICE_PASSWORD}
      - MYSQL_SERVICE_DB_PARAM=${NACOS_MYSQL_SERVICE_DB_PARAM}
      - TZ=${WORKSPACE_TIMEZONE}
    volumes:
      - nacos:/home/nacos/data
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    networks:
      - backend
    depends_on:
      - mysql
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
  ### Laravel Horizon ############################################
  laravel-horizon:
    restart: always
    build:
      context: ./laravel-horizon
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - LARADOCK_PHP_VERSION=${PHP_VERSION}
        - INSTALL_BZ2=${LARAVEL_HORIZON_INSTALL_BZ2}
        - INSTALL_GD=${LARAVEL_HORIZON_INSTALL_GD}
        - INSTALL_GMP=${LARAVEL_HORIZON_INSTALL_GMP}
        - INSTALL_GNUPG=${LARAVEL_HORIZON_INSTALL_GNUPG}
        - INSTALL_LDAP=${LARAVEL_HORIZON_INSTALL_LDAP}
        - INSTALL_IMAGEMAGICK=${LARAVEL_HORIZON_INSTALL_IMAGEMAGICK}
        - INSTALL_PGSQL=${PHP_FPM_INSTALL_PGSQL}
        - INSTALL_ZIP_ARCHIVE=${LARAVEL_HORIZON_INSTALL_ZIP_ARCHIVE}
        - INSTALL_BCMATH=${PHP_FPM_INSTALL_BCMATH}
        - INSTALL_MEMCACHED=${PHP_FPM_INSTALL_MEMCACHED}
        - INSTALL_SOCKETS=${LARAVEL_HORIZON_INSTALL_SOCKETS}
        - INSTALL_YAML=${LARAVEL_HORIZON_INSTALL_YAML}
        - INSTALL_CASSANDRA=${LARAVEL_HORIZON_INSTALL_CASSANDRA}
        - INSTALL_PHPREDIS=${LARAVEL_HORIZON_INSTALL_PHPREDIS}
        - INSTALL_MONGO=${LARAVEL_HORIZON_INSTALL_MONGO}
        - INSTALL_FFMPEG=${LARAVEL_HORIZON_INSTALL_FFMPEG}
        - INSTALL_AUDIOWAVEFORM=${LARAVEL_HORIZON_INSTALL_AUDIOWAVEFORM}
        - INSTALL_POPPLER_UTILS=${LARAVEL_HORIZON_INSTALL_POPPLER_UTILS}
        - PUID=${LARAVEL_HORIZON_PUID}
        - PGID=${LARAVEL_HORIZON_PGID}
        - IMAGEMAGICK_VERSION=${LARAVEL_HORIZON_IMAGEMAGICK_VERSION}
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}
      - ./laravel-horizon/supervisord.d:/etc/supervisord.d
    depends_on:
      - workspace
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      - backend

  ### Soketi Server ##############################################
  soketi:
    build:
      context: ./soketi
      args:
        - NODE_VERSION=${SOKETI_NODE_VERSION}
        - BASE_IMAGE_TAG_PREFIX=${SOKETI_BASE_IMAGE_TAG_PREFIX}
    volumes:
      - ./soketi/config.json:/app/bin/config.json:ro
    ports:
      - "${SOKETI_PORT}:6001"
      - "${SOKETI_METRICS_SERVER_PORT}:9601"
    networks:
      - frontend
      - backend

  ### NGINX Server #########################################
  nginx:
    restart: always
    build:
      context: ./nginx
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        # - PHP_UPSTREAM_CONTAINER=${NGINX_PHP_UPSTREAM_CONTAINER}
        # - PHP_UPSTREAM_PORT=${NGINX_PHP_UPSTREAM_PORT}
        - http_proxy
        - https_proxy
        - no_proxy
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${NGINX_HOST_LOG_PATH}:/var/log/nginx
      - ${NGINX_SITES_PATH}:/etc/nginx/sites-available
      - ${NGINX_SSL_PATH}:/etc/nginx/ssl
    ports:
      - "${NGINX_HOST_HTTP_PORT}:80"
      - "${NGINX_HOST_HTTPS_PORT}:443"
      - "${VARNISH_BACKEND_PORT}:81"
    # depends_on: # 先排除掉
    #   - php-fpm
    networks:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ### OpenResty Server #########################################
  openresty:
    restart: always
    build:
      context: ./openresty
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - PHP_UPSTREAM_CONTAINER=${OPENRESTY_PHP_UPSTREAM_CONTAINER}
        - PHP_UPSTREAM_PORT=${OPENRESTY_PHP_UPSTREAM_PORT}
        - http_proxy
        - https_proxy
        - no_proxy
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${OPENRESTY_HOST_LOG_PATH}:/var/log/nginx
      - ${OPENRESTY_SITES_PATH}:/etc/nginx/sites-available
      - ${OPENRESTY_SSL_PATH}:/etc/nginx/ssl
    ports:
      - "${OPENRESTY_HOST_HTTP_PORT}:80"
      - "${OPENRESTY_HOST_HTTPS_PORT}:443"
      - "${VARNISH_BACKEND_PORT}:81"
    depends_on:
      - php-fpm
    networks:
      - frontend
      - backend

  ### Blackfire ########################################
  blackfire:
    image: blackfire/blackfire
    environment:
      - BLACKFIRE_SERVER_ID=${BLACKFIRE_SERVER_ID}
      - BLACKFIRE_SERVER_TOKEN=${BLACKFIRE_SERVER_TOKEN}
    depends_on:
      - php-fpm
    networks:
      - backend

  ### Apache Server ########################################
  apache2:
    restart: always
    build:
      context: ./apache2
      args:
        - PHP_UPSTREAM_CONTAINER=${APACHE_PHP_UPSTREAM_CONTAINER}
        - PHP_UPSTREAM_PORT=${APACHE_PHP_UPSTREAM_PORT}
        - PHP_UPSTREAM_TIMEOUT=${APACHE_PHP_UPSTREAM_TIMEOUT}
        - DOCUMENT_ROOT=${APACHE_DOCUMENT_ROOT}
        - APACHE_INSTALL_HTTP2=${APACHE_INSTALL_HTTP2}
        - APACHE_FOR_MAC_M1=${APACHE_FOR_MAC_M1}
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${APACHE_HOST_LOG_PATH}:/var/log/apache2
      - ${APACHE_SITES_PATH}:/etc/apache2/sites-available
      - ${APACHE_SSL_PATH}:/etc/apache2/ssl
    ports:
      - "${APACHE_HOST_HTTP_PORT}:80"
      - "${APACHE_HOST_HTTPS_PORT}:443"
    depends_on:
      - php-fpm
    networks:
      - frontend
      - backend

  ### HHVM #################################################
  hhvm:
    restart: always
    build: ./hhvm
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    expose:
      - "9000"
    depends_on:
      - workspace
    networks:
      - frontend
      - backend

  ### Minio ################################################
  minio:
    restart: always
    build: ./minio
    volumes:
      - ${DATA_PATH_HOST}/minio/data:/export
      - ${DATA_PATH_HOST}/minio/config:/root/.minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    networks:
      - frontend
      - backend

  ### MySQL ################################################
  mysql57:
    cpus: 0.1
    mem_limit: 1g
    restart: always
    image: "mysql:5.7"
    userns_mode: "host"
    # privileged: true
    # [updated]
    # build:
    #   context: ./mysql
    #   args:
    #     - MYSQL_VERSION=${MYSQL_VERSION}
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PASS=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${WORKSPACE_TIMEZONE}
    volumes:
      # [REMOVE]
      #- ${DATA_PATH_HOST}/mysql:/var/lib/mysql
      #- ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      # [NEW]DATA_PATH_HOST
      - ${DATA_PATH_HOST}/mysql_5.7/conf:/etc/mysql/conf.d
      - ${DATA_PATH_HOST}/mysql_5.7/log:/var/log/mysql
      - ${DATA_PATH_HOST}/mysql_5.7/data:/var/lib/mysql
    env_file:
      - ./mysql/mysql.env
    ports:
      - "${MYSQL57_PORT:-3304}:3306"
    networks:
      - backend
    # healthcheck:
    #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10
  mysql80:
    cpus: 0.1
    mem_limit: 1g
    restart: always
    image: "mysql:8.0"
    userns_mode: "host"
    # privileged: true
    # [updated]
    # build:
    #   context: ./mysql
    #   args:
    #     - MYSQL_VERSION=${MYSQL_VERSION}
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PASS=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${WORKSPACE_TIMEZONE}
    volumes:
      # [REMOVE]
      #- ${DATA_PATH_HOST}/mysql:/var/lib/mysql
      #- ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      # [NEW]DATA_PATH_HOST
      - ${DATA_PATH_HOST}/mysql_8.0/conf:/etc/mysql/conf.d
      - ${DATA_PATH_HOST}/mysql_8.0/log:/var/log/mysql
      - ${DATA_PATH_HOST}/mysql_8.0/data:/var/lib/mysql
    env_file:
      - ./mysql/mysql.env
    ports:
      - "${MYSQL80_PORT:-3305}:3306"
    networks:
      - backend
  mysql:
    cpus: 0.1
    mem_limit: 1g
    restart: always
    image: "mysql:8.4"
    userns_mode: "host"
    # privileged: true
    # [updated]
    # build:
    #   context: ./mysql
    #   args:
    #     - MYSQL_VERSION=${MYSQL_VERSION}
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PASS=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${WORKSPACE_TIMEZONE}
    volumes:
      # [REMOVE]
      #- ${DATA_PATH_HOST}/mysql:/var/lib/mysql
      #- ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      # [NEW]DATA_PATH_HOST
      - ${DATA_PATH_HOST}/mysql_8.4/conf:/etc/mysql/conf.d
      - ${DATA_PATH_HOST}/mysql_8.4/log:/var/log/mysql
      - ${DATA_PATH_HOST}/mysql_8.4/data:/var/lib/mysql
    env_file:
      - ./mysql/mysql.env
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - backend
    # healthcheck:
    #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10
  ### Percona ################################################
  percona:
    restart: always
    build:
      context: ./percona
    environment:
      - MYSQL_DATABASE=${PERCONA_DATABASE}
      - MYSQL_USER=${PERCONA_USER}
      - MYSQL_PASSWORD=${PERCONA_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${PERCONA_ROOT_PASSWORD}
    volumes:
      - ${DATA_PATH_HOST}/percona:/var/lib/mysql
      - ${PERCONA_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    ports:
      - "${PERCONA_PORT}:3306"
    networks:
      - backend

  ### MSSQL ################################################
  mssql:
    restart: always
    build:
      context: ./mssql
    environment:
      - MSSQL_PID=Express
      - MSSQL_DATABASE=${MSSQL_DATABASE}
      - SA_PASSWORD=${MSSQL_PASSWORD}
      - ACCEPT_EULA=Y
    volumes:
      - mssql:/var/opt/mssql
    ports:
      - "${MSSQL_PORT}:1433"
    networks:
      - backend

  ### MariaDB ##############################################
  mariadb:
    restart: always
    build:
      context: ./mariadb
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - MARIADB_VERSION=${MARIADB_VERSION}
    volumes:
      - ${DATA_PATH_HOST}/mariadb:/var/lib/mysql
      - ${MARIADB_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    ports:
      - "${MARIADB_PORT}:3306"
    environment:
      - TZ=${WORKSPACE_TIMEZONE}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    networks:
      - backend

  ### PostgreSQL ###########################################
  postgres:
    restart: always
    build:
      context: ./postgres
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    volumes:
      - ${DATA_PATH_HOST}/postgres/data:/var/lib/postgresql/data
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GITLAB_POSTGRES_INIT=${GITLAB_POSTGRES_INIT}
      - GITLAB_POSTGRES_USER=${GITLAB_POSTGRES_USER}
      - GITLAB_POSTGRES_PASSWORD=${GITLAB_POSTGRES_PASSWORD}
      - GITLAB_POSTGRES_DB=${GITLAB_POSTGRES_DB}
      - KEYCLOAK_POSTGRES_INIT=${KEYCLOAK_POSTGRES_INIT}
      - KEYCLOAK_POSTGRES_USER=${KEYCLOAK_POSTGRES_USER}
      - KEYCLOAK_POSTGRES_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD}
      - KEYCLOAK_POSTGRES_DB=${KEYCLOAK_POSTGRES_DB}
      - JUPYTERHUB_POSTGRES_INIT=${JUPYTERHUB_POSTGRES_INIT}
      - JUPYTERHUB_POSTGRES_USER=${JUPYTERHUB_POSTGRES_USER}
      - JUPYTERHUB_POSTGRES_PASSWORD=${JUPYTERHUB_POSTGRES_PASSWORD}
      - JUPYTERHUB_POSTGRES_DB=${JUPYTERHUB_POSTGRES_DB}
      - SONARQUBE_POSTGRES_INIT=${SONARQUBE_POSTGRES_INIT}
      - SONARQUBE_POSTGRES_DB=${SONARQUBE_POSTGRES_DB}
      - SONARQUBE_POSTGRES_USER=${SONARQUBE_POSTGRES_USER}
      - SONARQUBE_POSTGRES_PASSWORD=${SONARQUBE_POSTGRES_PASSWORD}
      - POSTGRES_CONFLUENCE_INIT=${CONFLUENCE_POSTGRES_INIT}
      - POSTGRES_CONFLUENCE_DB=${CONFLUENCE_POSTGRES_DB}
      - POSTGRES_CONFLUENCE_USER=${CONFLUENCE_POSTGRES_USER}
      - POSTGRES_CONFLUENCE_PASSWORD=${CONFLUENCE_POSTGRES_PASSWORD}
    networks:
      - backend
  ### pgbackups PostgreSQL ###########################################
  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - ../backup:/backups
    links:
      - postgres
    environment:
      - POSTGRES_HOST={POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - backend

  ### PostgreSQL PostGis ###################################
  postgres-postgis:
    restart: always
    build:
      context: ./postgres-postgis
      args:
        - POSTGIS_VERSION=${POSTGIS_VERSION}
        - INSTALL_PGSQL_HTTP_FOR_POSTGIS13=${POSTGIS_INSTALL_PGSQL_HTTP_FOR_POSTGIS13}
    volumes:
      - ${DATA_PATH_HOST}/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - backend

  ### Neo4j ################################################
  neo4j:
    restart: always
    ports:
      - "7401:7474"
      - "7402:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      - ${DATA_PATH_HOST}/neo4j/data:/data
      - ${DATA_PATH_HOST}/neo4j/logs:/logs
    image: "neo4j:latest"
    networks:
      - backend
  ### Nats ################################################
  nats:
    build: ./nats
    ports:
      - "${NATS_CLIENT_PORT}:4222"
      - "${NATS_MONITORING_PORT}:6222"
      - "${NATS_ROUTE_PORT}:8222"
    networks:
      - backend

  ### MongoDB ##############################################
  mongo:
    restart: always
    build: ./mongo
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ${DATA_PATH_HOST}/mongo:/data/db
      - ${DATA_PATH_HOST}/mongo_config:/data/configdb
    networks:
      - backend

  ### RethinkDB ##############################################
  rethinkdb:
    restart: always
    build: ./rethinkdb
    ports:
      - "${RETHINKDB_PORT}:8080"
    volumes:
      - ${DATA_PATH_HOST}/rethinkdb:/data/rethinkdb_data
    networks:
      - backend

  ### ClickHouse #############################################
  clickhouse:
    build:
      context: ./clickhouse
      args:
        - CLICKHOUSE_VERSION=${CLICKHOUSE_VERSION}
        - CLICKHOUSE_GOSU_VERSION=${CLICKHOUSE_GOSU_VERSION}
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - ${DATA_PATH_HOST}/clickhouse:/var/lib/clickhouse
      - ${CLICKHOUSE_CUSTOM_CONFIG}:/etc/clickhouse-server/config.xml
      - ${CLICKHOUSE_USERS_CUSTOM_CONFIG}:/etc/clickhouse-server/users.xml
      - ${CLICKHOUSE_HOST_LOG_PATH}:/var/log/clickhouse
      - ${CLICKHOUSE_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    links:
      - workspace
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_CLIENT_PORT}:9000"
      - "${CLICKHOUSE_NATIVE_PORT}:9009"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    networks:
      #        - frontend
      - backend

  ### Redis ################################################
  redis:
    cpus: 0.05
    mem_limit: 200m
    restart: always
    build: ./redis
    volumes:
      - ${DATA_PATH_HOST}/redis/data:/data
    command: --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - backend

  ### Redis Cluster ##########################################
  redis-cluster:
    restart: always
    build: ./redis-cluster
    ports:
      - "${REDIS_CLUSTER_PORT_RANGE}:7000-7005"
    networks:
      - backend
  ### SSDB ################################################
  ssdb:
    restart: always
    build: ./ssdb
    volumes:
      - ${DATA_PATH_HOST}/ssdb:/data
    ports:
      - "${SSDB_PORT}:8888"
    networks:
      - backend

  ### ZooKeeper #########################################
  zookeeper:
    restart: always
    build: ./zookeeper
    volumes:
      - ${DATA_PATH_HOST}/zookeeper/data:/data
      - ${DATA_PATH_HOST}/zookeeper/datalog:/datalog
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    networks:
      - backend

  ### Aerospike ##########################################
  aerospike:
    restart: always
    build: ./aerospike
    volumes:
      - workspace
      - ${DATA_PATH_HOST}/aerospike:/opt/aerospike/data
    ports:
      - "${AEROSPIKE_SERVICE_PORT}:3000"
      - "${AEROSPIKE_FABRIC_PORT}:3001"
      - "${AEROSPIKE_HEARTBEAT_PORT}:3002"
      - "${AEROSPIKE_INFO_PORT}:3003"
    environment:
      - STORAGE_GB=${AEROSPIKE_STORAGE_GB}
      - MEM_GB=${AEROSPIKE_MEM_GB}
      - NAMESPACE=${AEROSPIKE_NAMESPACE}
    networks:
      - backend

  ### Memcached ############################################
  memcached:
    restart: always
    build: ./memcached
    volumes:
      - ${DATA_PATH_HOST}/memcached:/var/lib/memcached
    ports:
      - "${MEMCACHED_HOST_PORT}:11211"
    depends_on:
      - php-fpm
    networks:
      - backend

  ### Beanstalkd ###########################################
  beanstalkd:
    restart: always
    build: ./beanstalkd
    ports:
      - "${BEANSTALKD_HOST_PORT}:11300"
    # privileged: true
    userns_mode: "host"
    depends_on:
      - php-fpm
    networks:
      - backend

  ### SQS #############################################
  sqs:
    restart: always
    build: ./sqs
    ports:
      - "${SQS_NODE_HOST_PORT}:9324"
      - "${SQS_MANAGEMENT_HTTP_HOST_PORT}:9325"
    # privileged: true
    userns_mode: "host"
    hostname: laradock-sqs
    volumes:
      - ${DATA_PATH_HOST}/sqs:/opt/custom
    networks:
      - frontend
      - backend

  ### RabbitMQ #############################################
  rabbitmq:
    restart: always
    build: ./rabbitmq
    ports:
      - "${RABBITMQ_NODE_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HTTP_HOST_PORT}:15672"
      - "${RABBITMQ_MANAGEMENT_HTTPS_HOST_PORT}:15671"
      - "${RABBITMQ_WEB_STOMP_HOST_PORT}:15674"
    # privileged: true
    userns_mode: "host"
    hostname: laradock-rabbitmq
    volumes:
      - ${DATA_PATH_HOST}/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/management_agent.disable_metrics_collector.conf:/etc/rabbitmq/conf.d/management_agent.disable_metrics_collector.conf
    # depends_on:
    #   - php-fpm
    networks:
      - backend

  ### Mercure #############################################
  mercure:
    restart: always
    build: ./mercure
    ports:
      - "${MERCURE_NODE_HOST_HTTP_PORT}:80"
      - "${MERCURE_NODE_HOST_HTTPS_PORT}:443"
    # privileged: true
    userns_mode: "host"
    environment:
      - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_PUBLISHER_JWT_KEY}
      - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_SUBSCRIBER_JWT_KEY}
      - DEBUG=${MERCURE_DEBUG}
      - SERVER_NAME=${MERCURE_SERVER_NAME}
      - MERCURE_EXTRA_DIRECTIVES=cors_allowed_origins *\npublish_allowed_origins http://localhost:${MERCURE_NODE_HOST_HTTP_PORT} https://localhost:${MERCURE_NODE_HOST_HTTP_PORT}
    hostname: laradock-mercure
    networks:
      - frontend
      - backend

  ### Cassandra ############################################
  cassandra:
    restart: always
    build: ./cassandra
    ports:
      - "${CASSANDRA_TRANSPORT_PORT_NUMBER}:7000"
      - "${CASSANDRA_JMX_PORT_NUMBER}:7199"
      - "${CASSANDRA_CQL_PORT_NUMBER}:9042"
    # privileged: true
    userns_mode: "host"
    environment:
      - CASSANDRA_VERSION=${CASSANDRA_VERSION}
      - CASSANDRA_TRANSPORT_PORT_NUMBER=${CASSANDRA_TRANSPORT_PORT_NUMBER}
      - CASSANDRA_JMX_PORT_NUMBER=${CASSANDRA_JMX_PORT_NUMBER}
      - CASSANDRA_CQL_PORT_NUMBER=${CASSANDRA_CQL_PORT_NUMBER}
      - CASSANDRA_USER=${CASSANDRA_USER}
      - CASSANDRA_PASSWORD_SEEDER=${CASSANDRA_PASSWORD_SEEDER}
      - CASSANDRA_PASSWORD=${CASSANDRA_PASSWORD}
      - CASSANDRA_NUM_TOKENS=${CASSANDRA_NUM_TOKENS}
      - CASSANDRA_HOST=${CASSANDRA_HOST}
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME}
      - CASSANDRA_SEEDS=${CASSANDRA_SEEDS}
      - CASSANDRA_ENDPOINT_SNITCH=${CASSANDRA_ENDPOINT_SNITCH}
      - CASSANDRA_ENABLE_RPC=${CASSANDRA_ENABLE_RPC}
      - CASSANDRA_DATACENTER=${CASSANDRA_DATACENTER}
      - CASSANDRA_RACK=${CASSANDRA_RACK}
    hostname: laradock-cassandra
    volumes:
      - ${DATA_PATH_HOST}/cassandra:/var/lib/cassandra
    depends_on:
      - php-fpm
    networks:
      - backend

  ### Gearman ############################################
  gearman:
    restart: always
    build: ./gearman
    ports:
      - "${GEARMAN_PORT}:4730"
    # privileged: true
    userns_mode: "host"
    environment:
      - GEARMAN_VERSION=${GEARMAN_VERSION}
      - GEARMAN_VERBOSE=${GEARMAN_VERBOSE}
      - GEARMAN_QUEUE_TYPE=${GEARMAN_QUEUE_TYPE}
      - GEARMAN_THREADS=${GEARMAN_THREADS}
      - GEARMAN_BACKLOG=${GEARMAN_BACKLOG}
      - GEARMAN_FILE_DESCRIPTORS=${GEARMAN_FILE_DESCRIPTORS}
      - GEARMAN_JOB_RETRIES=${GEARMAN_JOB_RETRIES}
      - GEARMAN_ROUND_ROBIN=${GEARMAN_ROUND_ROBIN}
      - GEARMAN_WORKER_WAKEUP=${GEARMAN_WORKER_WAKEUP}
      - GEARMAN_KEEPALIVE=${GEARMAN_KEEPALIVE}
      - GEARMAN_KEEPALIVE_IDLE=${GEARMAN_KEEPALIVE_IDLE}
      - GEARMAN_KEEPALIVE_INTERVAL=${GEARMAN_KEEPALIVE_INTERVAL}
      - GEARMAN_KEEPALIVE_COUNT=${GEARMAN_KEEPALIVE_COUNT}
      - GEARMAN_MYSQL_HOST=${GEARMAN_MYSQL_HOST}
      - GEARMAN_MYSQL_PORT=${GEARMAN_MYSQL_PORT}
      - GEARMAN_MYSQL_USER=${GEARMAN_MYSQL_USER}
      - GEARMAN_MYSQL_PASSWORD=${GEARMAN_MYSQL_PASSWORD}
      - GEARMAN_MYSQL_PASSWORD_FILE=${GEARMAN_MYSQL_PASSWORD_FILE}
      - GEARMAN_MYSQL_DB=${GEARMAN_MYSQL_DB}
      - GEARMAN_MYSQL_TABLE=${GEARMAN_MYSQL_TABLE}
    hostname: laradock-gearman
    depends_on:
      - php-fpm
    networks:
      - backend

  ### Beanstalkd Console ###################################
  beanstalkd-console:
    restart: always
    build: ./beanstalkd-console
    ports:
      - "${BEANSTALKD_CONSOLE_HOST_PORT}:2080"
    depends_on:
      - beanstalkd
    networks:
      - backend

  ### Caddy Server #########################################
  caddy:
    restart: always
    build: ./caddy
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${CADDY_CONFIG_PATH}:/etc/caddy
      - ${CADDY_HOST_LOG_PATH}:/var/log/caddy
      - ${DATA_PATH_HOST}:/root/.caddy
    ports:
      - "${CADDY_HOST_HTTP_PORT}:80"
      - "${CADDY_HOST_HTTPS_PORT}:443"
    depends_on:
      - php-fpm
    networks:
      - frontend
      - backend

  ### phpMyAdmin ###########################################
  phpmyadmin:
    restart: always
    build: ./phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - MYSQL_USER=${PMA_USER}
      - MYSQL_PASSWORD=${PMA_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${PMA_ROOT_PASSWORD}
      - MAX_EXECUTION_TIME=${PMA_MAX_EXECUTION_TIME}
      - MEMORY_LIMIT=${PMA_MEMORY_LIMIT}
      - UPLOAD_LIMIT=${PMA_UPLOAD_LIMIT}
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      - "${PMA_DB_ENGINE}"
    networks:
      - frontend
      - backend

  ### Adminer ###########################################
  adminer:
    restart: always
    build:
      context: ./adminer
      args:
        - INSTALL_MSSQL=${ADM_INSTALL_MSSQL}
    environment:
      - ADMINER_PLUGINS=${ADM_PLUGINS}
      - ADMINER_DESIGN=${ADM_DESIGN}
      - ADMINER_DEFAULT_SERVER=${ADM_DEFAULT_SERVER}
    ports:
      - "${ADM_PORT}:8080"
    # depends_on:
    #   - php-fpm
    networks:
      - frontend
      - backend

  ### pgAdmin ##############################################
  pgadmin:
    restart: always
    image: dpage/pgadmin4:latest
    environment:
      - "PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}"
      - "PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ${DATA_PATH_HOST}/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - frontend
      - backend

  ### MeiliSearch ##########################################
  meilisearch: # [search][ES 替代]
    image: getmeili/meilisearch:latest
    volumes:
      - ${DATA_PATH_HOST}/meilisearch:/data.ms
    ports:
      - "${MEILISEARCH_HOST_PORT}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
    networks:
      - frontend
      - backend

  ### ElasticSearch ########################################
  elasticsearch:
    restart: always
    build:
      context: ./elasticsearch
      args:
        - ELK_VERSION=${ELK_VERSION}
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    environment:
      - cluster.name=laradock-cluster
      - node.name=laradock-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - indices.id_field_data.enabled=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # - cluster.initial_master_nodes=laradock-
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${ELASTICSEARCH_HOST_HTTP_PORT}:9200"
      - "${ELASTICSEARCH_HOST_TRANSPORT_PORT}:9300"
    # depends_on:
    #   - php-fpm
    networks:
      - frontend
      - backend

  ### Logstash ##############################################
  logstash:
    restart: always
    build:
      context: ./logstash
      args:
        - ELK_VERSION=${ELK_VERSION}
    volumes:
      - "./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml"
      - "./logstash/pipeline:/usr/share/logstash/pipeline"
    ports:
      - "5001:5001"
    environment:
      LS_JAVA_OPTS: "-Xmx1g -Xms1g"
    env_file:
      - .env
    networks:
      - frontend
      - backend
    depends_on:
      - elasticsearch

  ### Kibana ##############################################
  kibana:
    restart: always
    build:
      context: ./kibana
      args:
        - ELK_VERSION=${ELK_VERSION}
    ports:
      - "${KIBANA_HTTP_PORT}:5601"
    depends_on:
      - elasticsearch
    networks:
      - frontend
      - backend

  ### Dejavu ##############################################
  dejavu:
    restart: always
    build:
      context: ./dejavu
    ports:
      - "${DEJAVU_HTTP_PORT}:1358"
    depends_on:
      - elasticsearch
    networks:
      - frontend
      - backend

  ### Certbot #########################################
  certbot:
    build:
      context: ./certbot
    volumes:
      - ./data/certbot/certs/:/var/certs
      - ./certbot/letsencrypt/:/var/www/letsencrypt
    environment:
      - CN="fake.domain.com"
      - EMAIL="fake.email@gmail.com"
    networks:
      - frontend

  ### MailCatcher ################################################
  mailcatcher:
    restart: always
    build: ./mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - frontend
      - backend

  ### Mailhog ################################################
  mailhog:
    restart: always
    build: ./mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - frontend
      - backend

  ### MailDev ##############################################
  maildev:
    restart: always
    build: ./maildev
    ports:
      - "${MAILDEV_HTTP_PORT}:80"
      - "${MAILDEV_SMTP_PORT}:25"
    networks:
      - frontend
      - backend

  ### Mailpit ##############################################
  mailpit:
    restart: always
    build: ./mailpit
    ports:
      - "${MAILPIT_HTTP_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"
    networks:
      - frontend
      - backend

  ### Selenium ###############################################
  selenium:
    restart: always
    build: ./selenium
    ports:
      - "${SELENIUM_PORT}:4444"
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - frontend

  ### Varnish ##########################################
  proxy:
    restart: always
    container_name: proxy
    build: ./varnish
    expose:
      - ${VARNISH_PORT}
    environment:
      - VARNISH_CONFIG=${VARNISH_CONFIG}
      - CACHE_SIZE=${VARNISH_PROXY1_CACHE_SIZE}
      - VARNISHD_PARAMS=${VARNISHD_PARAMS}
      - VARNISH_PORT=${VARNISH_PORT}
      - BACKEND_HOST=${VARNISH_PROXY1_BACKEND_HOST}
      - BACKEND_PORT=${VARNISH_BACKEND_PORT}
      - VARNISH_SERVER=${VARNISH_PROXY1_SERVER}
    ports:
      - "${VARNISH_PORT}:${VARNISH_PORT}"
    links:
      - workspace
    networks:
      - frontend

  proxy2:
    container_name: proxy2
    build: ./varnish
    expose:
      - ${VARNISH_PORT}
    environment:
      - VARNISH_CONFIG=${VARNISH_CONFIG}
      - CACHE_SIZE=${VARNISH_PROXY2_CACHE_SIZE}
      - VARNISHD_PARAMS=${VARNISHD_PARAMS}
      - VARNISH_PORT=${VARNISH_PORT}
      - BACKEND_HOST=${VARNISH_PROXY2_BACKEND_HOST}
      - BACKEND_PORT=${VARNISH_BACKEND_PORT}
      - VARNISH_SERVER=${VARNISH_PROXY2_SERVER}
    ports:
      - "${VARNISH_PORT}:${VARNISH_PORT}"
    links:
      - workspace
    networks:
      - frontend

  ### HAProxy ####################################
  haproxy:
    restart: always
    build: ./haproxy
    ports:
      - "${HAPROXY_HOST_HTTP_PORT}:8085"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    links:
      - proxy
      - proxy2

  ### Jenkins ###################################################
  jenkins:
    restart: always
    build: ./jenkins
    environment:
      JAVA_OPTS: "-Djava.awt.headless=true"
    ports:
      - "${JENKINS_HOST_SLAVE_AGENT_PORT}:50000"
      - "${JENKINS_HOST_HTTP_PORT}:8080"
    # privileged: true
    userns_mode: "host"
    volumes:
      - ${JENKINS_HOME}:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend
      - backend

  ### Grafana ################################################
  grafana:
    restart: always
    build:
      context: ./grafana
    volumes:
      - ${DATA_PATH_HOST}/grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - backend

  ### Graylog #######################################
  graylog:
    restart: always
    build: ./graylog
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_SHA256_PASSWORD}
      - GRAYLOG_HTTP_EXTERNAL_URI=http://127.0.0.1:${GRAYLOG_PORT}/
    links:
      - mongo
      - elasticsearch
    depends_on:
      - mongo
      - elasticsearch
    ports:
      # Graylog web interface and REST API
      - ${GRAYLOG_PORT}:9000
      # Syslog TCP
      - ${GRAYLOG_SYSLOG_TCP_PORT}:514
      # Syslog UDP
      - ${GRAYLOG_SYSLOG_UDP_PORT}:514/udp
      # GELF TCP
      - ${GRAYLOG_GELF_TCP_PORT}:12201
      # GELF UDP
      - ${GRAYLOG_GELF_UDP_PORT}:12201/udp
    user: graylog
    volumes:
      - ${DATA_PATH_HOST}/graylog:/usr/share/graylog/data
    networks:
      - backend

  ### Laravel Echo Server #######################################
  laravel-echo-server:
    restart: always
    build:
      context: ./laravel-echo-server
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
    volumes:
      - ./laravel-echo-server/laravel-echo-server.json:/app/laravel-echo-server.json:ro
    ports:
      - "${LARAVEL_ECHO_SERVER_PORT}:6001"
    links:
      - redis
    networks:
      - frontend
      - backend

  ### Solr ################################################
  solr: # [search]
    restart: always
    build:
      context: ./solr
      args:
        - SOLR_VERSION=${SOLR_VERSION}
        - SOLR_DATAIMPORTHANDLER_MYSQL=${SOLR_DATAIMPORTHANDLER_MYSQL}
        - SOLR_DATAIMPORTHANDLER_MSSQL=${SOLR_DATAIMPORTHANDLER_MSSQL}
    volumes:
      - ${DATA_PATH_HOST}/solr:/opt/solr/server/solr/mycores
    ports:
      - "${SOLR_PORT}:8983"
    networks:
      - backend

  ### Thumbor #########################################
  thumbor:
    restart: always
    build: ./thumbor
    volumes:
      - ${DATA_PATH_HOST}/thumbor/data:/data
      - ${DATA_PATH_HOST}/thumbor/data:/logs
    ports:
      - "${THUMBOR_PORT}:8000"
    environment:
      - THUMBOR_LOG_FORMAT=${THUMBOR_LOG_FORMAT}
      - THUMBOR_LOG_DATE_FORMAT=${THUMBOR_LOG_DATE_FORMAT}
      - MAX_WIDTH=${MAX_WIDTH}
      - MAX_HEIGHT=${MAX_HEIGHT}
      - MIN_WIDTH=${MIN_WIDTH}
      - MIN_HEIGHT=${MIN_HEIGHT}
      - ALLOWED_SOURCES=${ALLOWED_SOURCES}
      - QUALITY=${QUALITY}
      - WEBP_QUALITY=${WEBP_QUALITY}
      - PNG_COMPRESSION_LEVEL=${PNG_COMPRESSION_LEVEL}
      - AUTO_WEBP=${AUTO_WEBP}
      - MAX_AGE=${MAX_AGE}
      - MAX_AGE_TEMP_IMAGE=${MAX_AGE_TEMP_IMAGE}
      - RESPECT_ORIENTATION=${RESPECT_ORIENTATION}
      - IGNORE_SMART_ERRORS=${IGNORE_SMART_ERRORS}
      - PRESERVE_EXIF_INFO=${PRESERVE_EXIF_INFO}
      - ALLOW_ANIMATED_GIFS=${ALLOW_ANIMATED_GIFS}
      - USE_GIFSICLE_ENGINE=${USE_GIFSICLE_ENGINE}
      - USE_BLACKLIST=${USE_BLACKLIST}
      - LOADER=${LOADER}
      - STORAGE=${STORAGE}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - RESULT_STORAGE=${RESULT_STORAGE}
      - ENGINE=${ENGINE}
      - SECURITY_KEY=${SECURITY_KEY}
      - ALLOW_UNSAFE_URL=${ALLOW_UNSAFE_URL}
      - ALLOW_OLD_URLS=${ALLOW_OLD_URLS}
      - FILE_LOADER_ROOT_PATH=${FILE_LOADER_ROOT_PATH}
      - HTTP_LOADER_CONNECT_TIMEOUT=${HTTP_LOADER_CONNECT_TIMEOUT}
      - HTTP_LOADER_REQUEST_TIMEOUT=${HTTP_LOADER_REQUEST_TIMEOUT}
      - HTTP_LOADER_FOLLOW_REDIRECTS=${HTTP_LOADER_FOLLOW_REDIRECTS}
      - HTTP_LOADER_MAX_REDIRECTS=${HTTP_LOADER_MAX_REDIRECTS}
      - HTTP_LOADER_FORWARD_USER_AGENT=${HTTP_LOADER_FORWARD_USER_AGENT}
      - HTTP_LOADER_DEFAULT_USER_AGENT=${HTTP_LOADER_DEFAULT_USER_AGENT}
      - HTTP_LOADER_PROXY_HOST=${HTTP_LOADER_PROXY_HOST}
      - HTTP_LOADER_PROXY_PORT=${HTTP_LOADER_PROXY_PORT}
      - HTTP_LOADER_PROXY_USERNAME=${HTTP_LOADER_PROXY_USERNAME}
      - HTTP_LOADER_PROXY_PASSWORD=${HTTP_LOADER_PROXY_PASSWORD}
      - HTTP_LOADER_CA_CERTS=${HTTP_LOADER_CA_CERTS}
      - HTTP_LOADER_VALIDATE_CERTS=${HTTP_LOADER_VALIDATE_CERTS}
      - HTTP_LOADER_CLIENT_KEY=${HTTP_LOADER_CLIENT_KEY}
      - HTTP_LOADER_CLIENT_CERT=${HTTP_LOADER_CLIENT_CERT}
      - HTTP_LOADER_CURL_ASYNC_HTTP_CLIENT=${HTTP_LOADER_CURL_ASYNC_HTTP_CLIENT}
      - STORAGE_EXPIRATION_SECONDS=${STORAGE_EXPIRATION_SECONDS}
      - STORES_CRYPTO_KEY_FOR_EACH_IMAGE=${STORES_CRYPTO_KEY_FOR_EACH_IMAGE}
      - FILE_STORAGE_ROOT_PATH=${FILE_STORAGE_ROOT_PATH}
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE}
      - UPLOAD_ENABLED=${UPLOAD_ENABLED}
      - UPLOAD_PHOTO_STORAGE=${UPLOAD_PHOTO_STORAGE}
      - UPLOAD_DELETE_ALLOWED=${UPLOAD_DELETE_ALLOWED}
      - UPLOAD_PUT_ALLOWED=${UPLOAD_PUT_ALLOWED}
      - UPLOAD_DEFAULT_FILENAME=${UPLOAD_DEFAULT_FILENAME}
      - MONGO_STORAGE_SERVER_HOST=${MONGO_STORAGE_SERVER_HOST}
      - MONGO_STORAGE_SERVER_PORT=${MONGO_STORAGE_SERVER_PORT}
      - MONGO_STORAGE_SERVER_DB=${MONGO_STORAGE_SERVER_DB}
      - MONGO_STORAGE_SERVER_COLLECTION=${MONGO_STORAGE_SERVER_COLLECTION}
      - REDIS_STORAGE_SERVER_HOST=${REDIS_STORAGE_SERVER_HOST}
      - REDIS_STORAGE_SERVER_PORT=${REDIS_STORAGE_SERVER_PORT}
      - REDIS_STORAGE_SERVER_DB=${REDIS_STORAGE_SERVER_DB}
      - REDIS_STORAGE_SERVER_PASSWORD=${REDIS_STORAGE_SERVER_PASSWORD}
      - REDIS_RESULT_STORAGE_SERVER_HOST=${REDIS_RESULT_STORAGE_SERVER_HOST}
      - REDIS_RESULT_STORAGE_SERVER_PORT=${REDIS_RESULT_STORAGE_SERVER_PORT}
      - REDIS_RESULT_STORAGE_SERVER_DB=${REDIS_RESULT_STORAGE_SERVER_DB}
      - REDIS_RESULT_STORAGE_SERVER_PASSWORD=${REDIS_RESULT_STORAGE_SERVER_PASSWORD}
      - MEMCACHE_STORAGE_SERVERS=${MEMCACHE_STORAGE_SERVERS}
      - MIXED_STORAGE_FILE_STORAGE=${MIXED_STORAGE_FILE_STORAGE}
      - MIXED_STORAGE_CRYPTO_STORAGE=${MIXED_STORAGE_CRYPTO_STORAGE}
      - MIXED_STORAGE_DETECTOR_STORAGE=${MIXED_STORAGE_DETECTOR_STORAGE}
      - META_CALLBACK_NAME=${META_CALLBACK_NAME}
      - DETECTORS=${DETECTORS}
      - FACE_DETECTOR_CASCADE_FILE=${FACE_DETECTOR_CASCADE_FILE}
      - OPTIMIZERS=${OPTIMIZERS}
      - JPEGTRAN_PATH=${JPEGTRAN_PATH}
      - PROGRESSIVE_JPEG=${PROGRESSIVE_JPEG}
      - RESULT_STORAGE_EXPIRATION_SECONDS=${RESULT_STORAGE_EXPIRATION_SECONDS}
      - RESULT_STORAGE_FILE_STORAGE_ROOT_PATH=${RESULT_STORAGE_FILE_STORAGE_ROOT_PATH}
      - RESULT_STORAGE_STORES_UNSAFE=${RESULT_STORAGE_STORES_UNSAFE}
      - REDIS_QUEUE_SERVER_HOST=${REDIS_QUEUE_SERVER_HOST}
      - REDIS_QUEUE_SERVER_PORT=${REDIS_QUEUE_SERVER_PORT}
      - REDIS_QUEUE_SERVER_DB=${REDIS_QUEUE_SERVER_DB}
      - REDIS_QUEUE_SERVER_PASSWORD=${REDIS_QUEUE_SERVER_PASSWORD}
      - SQS_QUEUE_KEY_ID=${SQS_QUEUE_KEY_ID}
      - SQS_QUEUE_KEY_SECRET=${SQS_QUEUE_KEY_SECRET}
      - SQS_QUEUE_REGION=${SQS_QUEUE_REGION}
      - USE_CUSTOM_ERROR_HANDLING=${USE_CUSTOM_ERROR_HANDLING}
      - ERROR_HANDLER_MODULE=${ERROR_HANDLER_MODULE}
      - ERROR_FILE_LOGGER=${ERROR_FILE_LOGGER}
      - ERROR_FILE_NAME_USE_CONTEXT=${ERROR_FILE_NAME_USE_CONTEXT}
      - SENTRY_DSN_URL=${SENTRY_DSN_URL}
      - TC_AWS_REGION=${TC_AWS_REGION}
      - TC_AWS_ENDPOINT=${TC_AWS_ENDPOINT}
      - TC_AWS_STORAGE_BUCKET=${TC_AWS_STORAGE_BUCKET}
      - TC_AWS_STORAGE_ROOT_PATH=${TC_AWS_STORAGE_ROOT_PATH}
      - TC_AWS_LOADER_BUCKET=${TC_AWS_LOADER_BUCKET}
      - TC_AWS_LOADER_ROOT_PATH=${TC_AWS_LOADER_ROOT_PATH}
      - TC_AWS_RESULT_STORAGE_BUCKET=${TC_AWS_RESULT_STORAGE_BUCKET}
      - TC_AWS_RESULT_STORAGE_ROOT_PATH=${TC_AWS_RESULT_STORAGE_ROOT_PATH}
      - TC_AWS_STORAGE_SSE=${TC_AWS_STORAGE_SSE}
      - TC_AWS_STORAGE_RRS=${TC_AWS_STORAGE_RRS}
      - TC_AWS_ENABLE_HTTP_LOADER=${TC_AWS_ENABLE_HTTP_LOADER}
      - TC_AWS_ALLOWED_BUCKETS=${TC_AWS_ALLOWED_BUCKETS}
      - TC_AWS_STORE_METADATA=${TC_AWS_STORE_METADATA}
    networks:
      - frontend
      - backend

  ### AWS EB-CLI ################################################
  aws:
    restart: always
    build:
      context: ./aws-eb-cli
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    depends_on:
      - workspace
    tty: true

  ### Portainer ################################################
  portainer:
    restart: always
    build:
      context: ./portainer
    volumes:
      - ${DATA_PATH_HOST}/portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      - 9010:9000
    networks:
      - backend

  ### Gitlab ################################################
  gitlab:
    build:
      context: ./gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_DOMAIN_NAME}'
        redis['enable'] = false
        nginx['listen_https'] = false
        nginx['listen_port'] = 80
        nginx['custom_gitlab_server_config'] = "set_real_ip_from 172.0.0.0/8;\nreal_ip_header X-Real-IP;\nreal_ip_recursive on;"
        postgresql['enable'] = false
        gitlab_rails['trusted_proxies'] = ['caddy','nginx','apache2']
        gitlab_rails['redis_host'] = 'redis'
        gitlab_rails['redis_database'] = 8
        gitlab_rails['redis_password'] = '${REDIS_PASSWORD}'
        gitlab_rails['db_host'] = '${GITLAB_POSTGRES_HOST}'
        gitlab_rails['db_username'] = '${GITLAB_POSTGRES_USER}'
        gitlab_rails['db_password'] = '${GITLAB_POSTGRES_PASSWORD}'
        gitlab_rails['db_database'] = '${GITLAB_POSTGRES_DB}'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_HOST_SSH_PORT}
    volumes:
      - ${DATA_PATH_HOST}/gitlab/conf:/etc/gitlab
      - ${DATA_PATH_HOST}/gitlab/data:/var/opt/gitlab
      - ${DATA_PATH_HOST}/gitlab/log:/var/log/gitlab
    ports:
      - "${GITLAB_HOST_HTTP_PORT}:80"
      - "${GITLAB_HOST_HTTPS_PORT}:443"
      - "${GITLAB_HOST_SSH_PORT}:22"
    networks:
      - backend
    depends_on:
      - redis
      - postgres
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    environment:
      - CI_SERVER_URL=${GITLAB_CI_SERVER_URL}
      - REGISTRATION_TOKEN=${GITLAB_RUNNER_REGISTRATION_TOKEN}
      - RUNNER_NAME=${COMPOSE_PROJECT_NAME}-runner
      - REGISTER_NON_INTERACTIVE=${GITLAB_REGISTER_NON_INTERACTIVE}
      - RUNNER_EXECUTOR=shell
    volumes:
      - ${DATA_PATH_HOST}/gitlab/runner:/etc/gitlab-runner
      # - /var/run/docker.sock:/var/run/docker.sock:rw
    restart: always

  ### JupyterHub #########################################
  jupyterhub:
    restart: always
    build:
      context: ./jupyterhub
    depends_on:
      - postgres
      - jupyterhub-user
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${DATA_PATH_HOST}/jupyterhub/:/data
      - ${JUPYTERHUB_CUSTOM_CONFIG}:/jupyterhub_config.py
      - ${JUPYTERHUB_USER_DATA}:/user-data
      - ${JUPYTERHUB_USER_LIST}:/userlist
    networks:
      - backend
    ports:
      - "${JUPYTERHUB_PORT}:80"
    environment:
      - TERM=xterm
      - JUPYTERHUB_USER_DATA=${JUPYTERHUB_USER_DATA}
      - JUPYTERHUB_POSTGRES_DB=${JUPYTERHUB_POSTGRES_DB}
      - JUPYTERHUB_POSTGRES_USER=${JUPYTERHUB_POSTGRES_USER}
      - JUPYTERHUB_POSTGRES_HOST=${JUPYTERHUB_POSTGRES_HOST}
      - JUPYTERHUB_POSTGRES_PASSWORD=${JUPYTERHUB_POSTGRES_PASSWORD}
      - JUPYTERHUB_OAUTH_CALLBACK_URL=${JUPYTERHUB_OAUTH_CALLBACK_URL}
      - JUPYTERHUB_OAUTH_CLIENT_ID=${JUPYTERHUB_OAUTH_CLIENT_ID}
      - JUPYTERHUB_OAUTH_CLIENT_SECRET=${JUPYTERHUB_OAUTH_CLIENT_SECRET}
      - JUPYTERHUB_LOCAL_NOTEBOOK_IMAGE=${COMPOSE_PROJECT_NAME}_jupyterhub-user
      - JUPYTERHUB_ENABLE_NVIDIA=${JUPYTERHUB_ENABLE_NVIDIA}
  jupyterhub-user:
    build:
      context: ./jupyterhub
      dockerfile: Dockerfile.user
    command: ["sh", "-c", 'echo "build only"']

  ### IPython #########################################
  ipython-controller:
    restart: always
    build:
      context: ./ipython
      dockerfile: Dockerfile.controller
    networks:
      - backend
    extra_hosts:
      - "laradock-ipython:${LARADOCK_IPYTHON_CONTROLLER_IP}"
    ports:
      - "33327-33338:33327-33338"
  ipython-engine:
    build:
      context: ./ipython
      dockerfile: Dockerfile.engine
    networks:
      - backend
    extra_hosts:
      - "laradock-ipython:${LARADOCK_IPYTHON_CONTROLLER_IP}"

  ### Docker-in-Docker ################################################
  docker-in-docker:
    restart: always
    image: docker:20.10-dind
    environment:
      DOCKER_TLS_SAN: DNS:docker-in-docker
    # privileged: true
    userns_mode: "host"
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}
      - docker-in-docker:/certs/client
    expose:
      - 2375
    networks:
      - backend

  ### NetData ################################################
  netdata:
    restart: always
    image: netdata/netdata:latest
    cap_add:
      - SYS_PTRACE
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${NETDATA_PORT}:19999"
    networks:
      - backend

  ### REDISWEBUI ################################################
  redis-webui:
    restart: always
    build:
      context: ./redis-webui
    environment:
      - ADMIN_USER=${REDIS_WEBUI_USERNAME}
      - ADMIN_PASS=${REDIS_WEBUI_PASSWORD}
      - REDIS_1_HOST=${REDIS_WEBUI_CONNECT_HOST}
      - REDIS_1_PORT=${REDIS_WEBUI_CONNECT_PORT}
      - REDIS_1_AUTH=${REDIS_PASSWORD}
    networks:
      - backend
    ports:
      - "${REDIS_WEBUI_PORT}:80"
    depends_on:
      - redis

  ### MongoWebUI ################################################
  mongo-webui:
    restart: always
    build:
      context: ./mongo-webui
    environment:
      - ROOT_URL=${MONGO_WEBUI_ROOT_URL}
      - MONGO_URL=${MONGO_WEBUI_MONGO_URL}
      - INSTALL_MONGO=${MONGO_WEBUI_INSTALL_MONGO}
    volumes:
      - ${DATA_PATH_HOST}/mongo-webui:/data/db
    ports:
      - "${MONGO_WEBUI_PORT}:3000"
    networks:
      - backend
    depends_on:
      - mongo

  ### Metabase #################################################
  metabase:
    restart: always
    image: metabase/metabase:latest
    environment:
      - MB_DB_FILE=/metabase-data/${METABASE_DB_FILE}
    ports:
      - ${METABASE_PORT}:3000
    volumes:
      - ${DATA_PATH_HOST}/metabase-data:/metabase-data
    networks:
      - backend

  ### Weaver (Athena PDF) #################################################
  weaver:
    image: arachnysdocker/athenapdf-service
    ports:
      - "8080:8080"
    env_file:
      - ./weaver/conf/sample.env
    networks:
      - backend
    depends_on:
      - workspace

  ### IDE-THEIA ################################################
  ide-theia:
    build:
      context: ./ide-theia
    volumes:
      - ${APP_CODE_PATH_HOST}:/home/project
    ports:
      - "${IDE_THEIA_PORT}:3000"
    networks:
      - backend

  ### IDE-WEBIDE ################################################
  ide-webide:
    build:
      context: ./ide-webide
    volumes:
      - ${DATA_PATH_HOST}/ide/webide/ide.db:/root/.coding-ide/ide.db
    ports:
      - "${IDE_WEBIDE_PORT}:8080"
    networks:
      - backend

  ### IDE-CODIAD ################################################
  ide-codiad:
    build:
      context: ./ide-codiad
    environment:
      - APP_CODE_PATH_CONTAINER=${APP_CODE_PATH_CONTAINER}
      - TZ=${WORKSPACE_TIMEZONE}
      - PGID=1000
      - PUID=1000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}
      - ${DATA_PATH_HOST}/ide/codiad:/config
    ports:
      - "${IDE_CODIAD_PORT}:80"
    networks:
      - backend

  ### IDE-ICECODER ################################################
  ide-icecoder:
    build:
      context: ./ide-icecoder
    environment:
      - DOCUMENT_ROOT=${APP_CODE_PATH_CONTAINER}
      - TZ=${WORKSPACE_TIMEZONE}
      - PGID=1000
      - PUID=1000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APP_CODE_PATH_HOST}:/home/laradock/ICEcoder/dev
    ports:
      - "${IDE_ICECODER_PORT}:8080"
    networks:
      - backend

  ### DOCKER-REGISTRY ################################################
  docker-registry:
    build:
      context: ./docker-registry
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_PATH_HOST}/docker-registry:/var/lib/registry
    ports:
      - "${DOCKER_REGISTRY_PORT}:5000"
    networks:
      - backend

  ### DOCKER-WEB-UI ################################################
  docker-web-ui:
    build:
      context: ./docker-web-ui
    environment:
      - TZ=${WORKSPACE_TIMEZONE}
      - ENV_DOCKER_REGISTRY_HOST=${DOCKER_WEBUI_REGISTRY_HOST}
      - ENV_DOCKER_REGISTRY_PORT=${DOCKER_WEBUI_REGISTRY_PORT}
      - ENV_DOCKER_REGISTRY_USE_SSL=${DOCKER_REGISTRY_USE_SSL}
      - ENV_MODE_BROWSE_ONLY=${DOCKER_REGISTRY_BROWSE_ONLY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${DOCKER_WEBUI_PORT}:80"
    networks:
      - frontend
      - backend

  ### MAILU ################################################
  mailu:
    image: mailu/admin:${MAILU_VERSION}
    volumes:
      - "${DATA_PATH_HOST}/mailu/data:/data"
      - "${DATA_PATH_HOST}/mailu/dkim:/dkim"
      - "${DATA_PATH_HOST}/mailu/webmail:/webmail"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - mailu-front
      - mailu-imap
      - mailu-smtp
      - mailu-antispam
      - mailu-antivirus
      - mailu-webdav
      - mailu-admin
      - mailu-webmail
      - mailu-fetchmail
    command:
      [
        "sh",
        "-c",
        'echo ${MAILU_INIT_ADMIN_USERNAME}@${MAILU_DOMAIN} ${MAILU_INIT_ADMIN_PASSWORD} ;python manage.py advertise ; python manage.py db upgrade ; python manage.py admin ${MAILU_INIT_ADMIN_USERNAME} ${MAILU_DOMAIN} ${MAILU_INIT_ADMIN_PASSWORD} || true;sed -i -- "s/= Off/= On/g" /webmail/_data_/_default_/configs/config.ini || true;if grep -Fq "registration_link_url" /webmail/_data_/_default_/configs/config.ini;then echo Already set!;else echo "" >> /webmail/_data_/_default_/configs/config.ini; echo "[login]" >> /webmail/_data_/_default_/configs/config.ini;echo "registration_link_url = ''${MAILU_WEBSITE}${MAILU_WEB_ADMIN}/ui/user/signup''" >> /webmail/_data_/_default_/configs/config.ini;fi',
      ]
    networks:
      - backend
  mailu-front:
    image: mailu/nginx:${MAILU_VERSION}
    environment:
      - ADMIN=${MAILU_ADMIN}
      - WEB_ADMIN=${MAILU_WEB_ADMIN}
      - WEB_WEBMAIL=${MAILU_WEB_WEBMAIL}
      - WEBDAV=${MAILU_WEBDAV}
      - HOSTNAMES=${MAILU_HOSTNAMES}
      - TLS_FLAVOR=${MAILU_TLS_FLAVOR}
      - MESSAGE_SIZE_LIMIT=${MAILU_MESSAGE_SIZE_LIMIT}
    ports:
      - "${MAILU_HTTP_PORT}:80"
      - "${MAILU_HTTPS_PORT}:443"
      - "110:110"
      - "143:143"
      - "993:993"
      - "995:995"
      - "25:25"
      - "465:465"
      - "587:587"
    volumes:
      - "${DATA_PATH_HOST}/mailu/certs:/certs"
    networks:
      backend:
        aliases:
          - front
  mailu-imap:
    image: mailu/dovecot:${MAILU_VERSION}
    environment:
      - DOMAIN=${MAILU_DOMAIN}
      - HOSTNAMES=${MAILU_HOSTNAMES}
      - POSTMASTER=${MAILU_POSTMASTER}
      - WEBMAIL=${MAILU_WEBMAIL}
      - RECIPIENT_DELIMITER=${MAILU_RECIPIENT_DELIMITER}
    volumes:
      - "${DATA_PATH_HOST}/mailu/data:/data"
      - "${DATA_PATH_HOST}/mailu/mail:/mail"
      - "${DATA_PATH_HOST}/mailu/overrides:/overrides"
    depends_on:
      - mailu-front
    networks:
      backend:
        aliases:
          - imap
  mailu-smtp:
    image: mailu/postfix:${MAILU_VERSION}
    environment:
      - DOMAIN=${MAILU_DOMAIN}
      - HOSTNAMES=${MAILU_HOSTNAMES}
      - RELAYHOST=${MAILU_RELAYHOST}
      - RELAYNETS=${MAILU_RELAYNETS}
      - RECIPIENT_DELIMITER=${MAILU_RECIPIENT_DELIMITER}
      - MESSAGE_SIZE_LIMIT=${MAILU_MESSAGE_SIZE_LIMIT}
    volumes:
      - "${DATA_PATH_HOST}/mailu/data:/data"
      - "${DATA_PATH_HOST}/mailu/overrides:/overrides"
    depends_on:
      - mailu-front
    networks:
      backend:
        aliases:
          - smtp
  mailu-antispam:
    image: mailu/rspamd:${MAILU_VERSION}
    volumes:
      - "${DATA_PATH_HOST}/mailu/filter:/var/lib/rspamd"
      - "${DATA_PATH_HOST}/mailu/dkim:/dkim"
      - "${DATA_PATH_HOST}/mailu/overrides/rspamd:/etc/rspamd/override.d"
    depends_on:
      - mailu-front
    networks:
      backend:
        aliases:
          - antispam
  mailu-antivirus:
    image: mailu/clamav:${MAILU_VERSION}
    volumes:
      - "${DATA_PATH_HOST}/mailu/filter:/data"
    networks:
      backend:
        aliases:
          - antivirus
  mailu-webdav:
    image: mailu/${MAILU_WEBDAV}:${MAILU_VERSION}
    volumes:
      - "${DATA_PATH_HOST}/mailu/dav:/data"
    networks:
      backend:
        aliases:
          - webdav
  mailu-admin:
    image: mailu/admin:${MAILU_VERSION}
    environment:
      - DOMAIN=${MAILU_DOMAIN}
      - HOSTNAMES=${MAILU_HOSTNAMES}
      - POSTMASTER=${MAILU_POSTMASTER}
      - SECRET_KEY=${MAILU_SECRET_KEY}
      - AUTH_RATELIMIT=${MAILU_AUTH_RATELIMIT}
      - TLS_FLAVOR=${MAILU_TLS_FLAVOR}
      - DISABLE_STATISTICS=${MAILU_DISABLE_STATISTICS}
      - DMARC_RUA=${MAILU_DMARC_RUA}
      - DMARC_RUF=${MAILU_DMARC_RUF}
      - WELCOME=${MAILU_WELCOME}
      - WELCOME_SUBJECT=${MAILU_WELCOME_SUBJECT}
      - WELCOME_BODY=${MAILU_WELCOME_BODY}
      - WEB_ADMIN=${MAILU_WEB_ADMIN}
      - WEB_WEBMAIL=${MAILU_WEB_WEBMAIL}
      - WEBSITE=${MAILU_WEBSITE}
      - WEBMAIL=${MAILU_WEBMAIL}
      - SITENAME=${MAILU_SITENAME}
      - PASSWORD_SCHEME=${MAILU_PASSWORD_SCHEME}
      - RECAPTCHA_PUBLIC_KEY=${MAILU_RECAPTCHA_PUBLIC_KEY}
      - RECAPTCHA_PRIVATE_KEY=${MAILU_RECAPTCHA_PRIVATE_KEY}
    volumes:
      - "${DATA_PATH_HOST}/mailu/data:/data"
      - "${DATA_PATH_HOST}/mailu/dkim:/dkim"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
    networks:
      backend:
        aliases:
          - admin
  mailu-webmail:
    image: "mailu/${MAILU_WEBMAIL}:${MAILU_VERSION}"
    volumes:
      - "${DATA_PATH_HOST}/mailu/webmail:/data"
    networks:
      backend:
        aliases:
          - webmail
  mailu-fetchmail:
    image: mailu/fetchmail:${MAILU_VERSION}
    environment:
      - FETCHMAIL_DELAY=${MAILU_FETCHMAIL_DELAY}
    volumes:
      - "${DATA_PATH_HOST}/mailu/data:/data"
    networks:
      backend:
        aliases:
          - fetchmail

  ### TRAEFIK #########################################
  traefik:
    build:
      context: ./traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/data:/data
    command:
      - "--api"
      - "--providers.docker.exposedbydefault=false"
      - "--accesslog.filepath=/data/access.log"
      # entrypoints
      - "--entrypoints.http.address=:${TRAEFIK_HOST_HTTP_PORT}"
      - "--entrypoints.http.http.redirections.entrypoint.to=https"
      - "--entrypoints.https.address=:${TRAEFIK_HOST_HTTPS_PORT}"
      - "--entrypoints.traefik.address=:${TRAEFIK_DASHBOARD_PORT}"
      # certificatesresolvers
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http"
    ports:
      - "${TRAEFIK_HOST_HTTP_PORT}:${TRAEFIK_HOST_HTTP_PORT}"
      - "${TRAEFIK_HOST_HTTPS_PORT}:${TRAEFIK_HOST_HTTPS_PORT}"
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_PORT}"
    networks:
      - frontend
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${ACME_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=traefik"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=access-auth"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.access-auth.basicauth.realm=Login Required"
      - "traefik.http.middlewares.access-auth.basicauth.users=${TRAEFIK_DASHBOARD_USER}"

  ### MOSQUITTO Broker #########################################
  mosquitto:
    build:
      context: ./mosquitto
    volumes:
      - ${DATA_PATH_HOST}/mosquitto/data:/mosquitto/data
    ports:
      - "${MOSQUITTO_PORT}:9001"
    networks:
      - frontend
      - backend

  ### COUCHDB ###################################################
  couchdb:
    build:
      context: ./couchdb
    volumes:
      - ${DATA_PATH_HOST}/couchdb/data:/opt/couchdb/data
    ports:
      - "${COUCHDB_PORT}:5984"
    networks:
      - backend

  ### Manticore Search ###########################################
  manticore:
    build:
      context: ./manticore
    volumes:
      - ${MANTICORE_CONFIG_PATH}:/etc/sphinxsearch
      - ${DATA_PATH_HOST}/manticore/data:/var/lib/manticore/data
      - ${DATA_PATH_HOST}/manticore/log:/var/log/manticore
    ports:
      - "${MANTICORE_API_PORT}:9312"
      - "${MANTICORE_SPHINXQL_PORT}:9306"
      - "${MANTICORE_HTTP_PORT}:9308"
    networks:
      - backend

  ### SONARQUBE ################################################
  sonarqube:
    build:
      context: ./sonarqube
    hostname: "${SONARQUBE_HOSTNAME}"
    volumes:
      - ${DATA_PATH_HOST}/sonarqube/conf:/opt/sonarqube/conf
      - ${DATA_PATH_HOST}/sonarqube/data:/opt/sonarqube/data
      - ${DATA_PATH_HOST}/sonarqube/logs:/opt/sonarqube/logs
      - ${DATA_PATH_HOST}/sonarqube/extensions:/opt/sonarqube/extensions
      - ${DATA_PATH_HOST}/sonarqube/plugins:/opt/sonarqube/lib/bundled-plugins
    ports:
      - ${SONARQUBE_PORT}:9000
    depends_on:
      - postgres
    environment:
      - sonar.jdbc.username=${SONARQUBE_POSTGRES_USER}
      - sonar.jdbc.password=${SONARQUBE_POSTGRES_PASSWORD}
      - sonar.jdbc.url=jdbc:postgresql://${SONARQUBE_POSTGRES_HOST}:5432/${SONARQUBE_POSTGRES_DB}
    networks:
      - backend
      - frontend

  ### CONFLUENCE ################################################
  confluence:
    container_name: Confluence
    image: atlassian/confluence-server:${CONFLUENCE_VERSION}
    restart: always
    ports:
      - "${CONFLUENCE_HOST_HTTP_PORT}:8090"
    networks:
      - frontend
      - backend
    depends_on:
      - postgres
    volumes:
      - ${DATA_PATH_HOST}/Confluence:/var/atlassian/application-data

  ### SWAGGER EDITOR ############################################
  swagger-editor:
    build: ./swagger-editor
    ports:
      - ${SWAGGER_EDITOR_PORT}:8080
    networks:
      - backend

  ### SWAGGER UI ################################################
  swagger-ui:
    build: ./swagger-ui
    environment:
      - API_URL=${SWAGGER_API_URL}
    ports:
      - ${SWAGGER_UI_PORT}:8080
    networks:
      - backend

  ### tomcat ####################################################
  tomcat:
    container_name: tomcat
    image: tomcat:${TOMCAT_VERSION}
    ports:
      - "${TOMCAT_HOST_HTTP_PORT}:8080"
    networks:
      - frontend
      - backend
    volumes:
      - ${DATA_PATH_HOST}/tomcat/webapps:/usr/local/tomcat/webapps
      - ${DATA_PATH_HOST}/tomcat/logs:/usr/local/tomcat/logs
    # restart: always

  ### react #####################################################
  react:
    build:
      context: ./react
    ports:
      - "3000:3000"
    container_name: react
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - frontend
      - backend
    volumes:
      - ./react:/usr/src/app/react
      - /usr/src/app/react/node_modules
  hardhat:
    image: nikolaik/python-nodejs:python3.13-nodejs24
    volumes:
    # ${DATA_PATH_HOST}
      # 使用的项目属于固定配置,从容器中生成(init),持久化,在下次启动中重新使用
      - ./hardhat/data:/root/data
      # 缓存全局 npm 缓存,目录隔离
      - ${DATA_PATH_HOST}/hardhat/.npm:/root/.npm
    working_dir: /root/data/hardhat-example
    # 在启动时候开启节点服务 
    # 执行部署任务:
    # npx hardhat ignition deploy ignition/modules/bzz/bzz.ts --network hardhatMainnet --parameters ignition/parameters/local.json --write-localhost-deployment
    # command: ["sh", "-c", "npm install --prefer-offline --no-audit && npx hardhat node --network metain"]
    ports:
      # HTTP RPC 端口
      - "${HARDHAT_NODE_PORT:-8545}:8545"
      # 控制台端口
      - "${HARDHAT_CONSOLE_PORT:-8080}:8080"
    environment:
      # 国内加速配置
      - npm_mirror=https://npmmirror.com/mirrors/npm/
      - node_mirror=https://npmmirror.com/mirrors/node/
      - NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node/ 
      - TZ=${WORKSPACE_TIMEZONE}
    networks:
      - frontend
      - backend
    # extra_hosts:
    #   - "dockerhost:${DOCKER_HOST_IP}"
    
    tty: true
    stdin_open: true
  ### kafka ####################################################
  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: 127.0.0.1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_MESSAGE_MAX_BYTES: 2000000
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - ${DATA_PATH_HOST}/kafka:/kafka
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

  ### kafka-manager ###########################################
  kafka-manager:
    image: sheepkiller/kafka-manager
    ports:
      - 9020:9000
    environment:
      ZK_HOSTS: zookeeper:2181
    networks:
      - backend

  ### tarantool ###########################################
  tarantool:
    build: ./tarantool
    volumes:
      - ${DATA_PATH_HOST}/tarantool:/var/lib/tarantool
      - ./tarantool/lua:/opt/tarantool
    ports:
      - ${TARANTOOL_PORT}:3301
    networks:
      - backend
  tarantool-admin:
    build: ./tarantool-admin
    ports:
      - ${TARANTOOL_ADMIN_PORT}:80
    networks:
      - backend

  ### onedev ####################################################
  onedev:
    image: 1dev/server
    ports:
      - "${ONEDEV_HTTP_PORT}:6610"
      - "${ONEDEV_SSH_PORT}:6611"
    volumes:
      - ${DATA_PATH_HOST}/onedev:/opt/onedev
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend
      - backend
    restart: always

  ### keycloak ##################################################
  keycloak:
    image: bitnami/keycloak:${KEYCLOAK_VERSION:-latest}
    ports:
      - "${KEYCLOAK_HTTP_PORT}:${KEYCLOAK_HTTP_PORT}"
    environment:
      - KEYCLOAK_HTTP_PORT=${KEYCLOAK_HTTP_PORT}
      - KEYCLOAK_CREATE_ADMIN_USER=${KEYCLOAK_CREATE_ADMIN_USER}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_DATABASE_HOST=${KEYCLOAK_POSTGRES_HOST}
      - KEYCLOAK_DATABASE_PORT=${POSTGRES_PORT}
      - KEYCLOAK_DATABASE_NAME=${KEYCLOAK_POSTGRES_DB}
      - KEYCLOAK_DATABASE_USER=${KEYCLOAK_POSTGRES_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - frontend
      - backend
  ### nexus ##################################################
  nexus:
    image: sonatype/nexus3:${NEXUS_VERSION:-latest}
    restart: always
    environment:
      - TZ=${WORKSPACE_TIMEZONE}
    ports:
      - "${NEXUS_HTTP_PORT:-8081}:8081"
    volumes:
      - ${DATA_PATH_HOST}/nexus/data:/nexus-data
    networks:
      - frontend
      - backend
  ### kvrocks ##################################################
  kvrocks:
    image: apache/kvrocks:${KVROCKS_VERSION:-nightly}
    restart: always
    environment:
      - TZ=${WORKSPACE_TIMEZONE}
    ports:
      - ${KVROCKS_PORT:-6666}:6666
    volumes:
      - ${DATA_PATH_HOST}/kvrocks/data:/kvrocks_data
    networks:
      - frontend
      - backend
  ### busybox ##################################################
  busybox:
    image: busybox:${BUSYBOX_VERSION:-latest}
    restart: always
    environment:
      - TZ=${WORKSPACE_TIMEZONE}
    networks:
      - frontend
      - backend
  ### busybox-placeholder ##################################################
  # https://gogs.io/docs/
  gogs:
    image: gogs/gogs:${GOGS_VERSION:-latest}
    ports:
      - "${GOGS_HTTP_PORT:-3000}:3000" # 映射Gogs Web界面端口
      - "${GOGS_SSH_PORT:-22}:22" # 映射SSH服务端口（可选）
    volumes:
      - ${DATA_PATH_HOST}/gogs/data:/data # 持久化Gogs的数据和配置
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - frontend
      - backend
  # drone https://drone.cool/server/provider/gogs/
  drone-server:
    image: drone/drone:${DRONE_VERSION:-latest}
    ports:
      - "${DRONE_HTTP_PORT:-80}:80"
      - "${DRONE_HTTPS_PORT:-443}:443"
      # - "${DRONE_GRPC_PORT:-9000}:9000" # Drone 默认使用的 gRPC 端口
    volumes:
      - .${DATA_PATH_HOST}/drone/data:/data
    environment:
      - DRONE_AGENTS_ENABLED=true
      - DRONE_GOGS=true
      - DRONE_GOGS_URL=${DRONE_GOGS_URL:-http://gogs:3000} # Gogs 服务器地址
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET:-super-duper-secret} # 必须与 runner 的 secret 相匹配
      - DRONE_SERVER_HOST=${DRONE_SERVER_HOST:-localhost} # 替换为你的域名或 IP 地址 your-domain.com
      - DRONE_SERVER_PROTO=https # 如果使用 HTTPS，则设置此项
      - DRONE_DATABASE_DRIVER=sqlite3 # 或者 postgres/mysql
      - DRONE_DATABASE_DATASOURCE=/var/lib/drone/drone.sqlite # SQLite 数据库路径
      - DRONE_USER_CREATE=username:admin,admin:true,machine:false,token:your-admin-token # 创建初始管理员用户
    restart: always
    networks:
      - frontend
      - backend
  drone-runner:
    image: drone/drone-runner-docker:${DRONE-RUNNER_VERSION:-latest}
    depends_on:
      - drone-server
    environment:
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET:-super-duper-secret} # 必须与 server 的 secret 相匹配
      - DRONE_RUNNER_NAME=docker-runner
      - DRONE_SERVER=ws://drone-server:9000/ws/broker # 连接至 Drone Server 的 WebSocket 地址
    restart: always
    networks:
      - frontend
      - backend
  jupyter:
    image: continuumio/miniconda3:${MINICONDA_VERSION:-latest}
    ports:
      - "${JUPYTER_PORT:-8888}:8888" # 映射容器内的 8888 端口到主机的 8888 端口
    volumes:
        # [TODO] 这里需要策修改为传入项目地址
      - ${DATA_PATH_HOST}/jupyter/notebooks:/opt/notebooks # 挂载本地目录用于持久化笔记本文件
    command: >
      /bin/bash -c "
        /opt/conda/bin/conda install jupyter -y --quiet &&
        mkdir -p /opt/notebooks &&
        /opt/conda/bin/jupyter notebook
        --notebook-dir=/opt/notebooks
        --ip='*'
        --port=8888
        --no-browser
        --allow-root
      "
    tty: true # 等价于 -t 参数
    stdin_open: true # 等价于 -i 参数
    restart: always
    networks:
      - frontend
      - backend
  ### TDengine ################################################
  tdengine:
    cpus: 0.05
    mem_limit: 400m
    image: tdengine/tdengine:${TDENGINE_VERSION:-latest}  # 使用最新版本的TDengine镜像
    container_name: tdengine_server   # 容器名称
    restart: always                   # 总是重启容器
    environment:
      - TAOS_FQDN=tdengine            # 设置TDengine的完全限定域名
      - TDENGINE_USER=${TDENGINE_USER:-root}
      - TDENGINE_PASSWORD=${TDENGINE_PASSWORD:-taosdata}
    ports:
      - "6030-6049:6030-6049"         # 映射端口，包括taosd默认使用的端口范围
    networks:
      - frontend
      - backend       
    volumes:
      - ${DATA_PATH_HOST}/tdengine/taosdata:/var/lib/taos        # 数据持久化
      - ${DATA_PATH_HOST}/tdengine/taoslog:/var/log/taos         # 日志持久化
  rmqnamesrv:
    cpus: 0.05
    mem_limit: 400m
    image: apache/rocketmq:${ROCKETMQ_VERSION:-latest}
    container_name: rmqnamesrv
    ports:
      - 9876:9876
    networks:
      - backend       
    command: sh mqnamesrv
    volumes:
      - ${DATA_PATH_HOST}/rmqnamesrv/logs:/home/rocketmq/logs
      - ${DATA_PATH_HOST}/rmqnamesrv/bin/runserver.sh:/home/rocketmq/rocketmq-${ROCKETMQ_VERSION}/bin/runserver.sh
  rmqbroker:
    cpus: 0.05
    mem_limit: 500m
    image: apache/rocketmq:${ROCKETMQ_VERSION:-latest}
    container_name: rmqbroker
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - rmqnamesrv
    networks:
      - backend      
    command: sh mqbroker
    volumes:
      - ${DATA_PATH_HOST}/rmqbroker/logs:/home/rocketmq/logs
      - ${DATA_PATH_HOST}/rmqbroker/store:/home/rocketmq/store
      - ${DATA_PATH_HOST}/rmqbroker/conf/broker.conf:/home/rocketmq/rocketmq-${ROCKETMQ_VERSION}/conf/broker.conf
      - ${DATA_PATH_HOST}/rmqbroker/conf/plain_acl.yml:/home/rocketmq/rocketmq-${ROCKETMQ_VERSION}/conf/plain_acl.yml
      - ${DATA_PATH_HOST}/rmqbroker/bin/runbroker.sh:/home/rocketmq/rocketmq-${ROCKETMQ_VERSION}/bin/runbroker.sh
  rmqproxy:
    cpus: 0.05
    mem_limit: 400m
    image: apache/rocketmq:${ROCKETMQ_VERSION:-latest}
    container_name: rmqproxy
    networks:
      - backend      
    depends_on:
      - rmqnamesrv
      - rmqbroker
    ports:
      - 8071:8081
    restart: on-failure
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqproxy
  rmqdashboard:
    cpus: 0.05
    mem_limit: 400m
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    ports:
      - 8070:8080
    restart: always
    # privileged: true
    userns_mode: "host"
    networks:
      - frontend
      - backend  
    depends_on:
      - 'rmqnamesrv'
    environment:
      - JAVA_OPTS= -Xmx256M -Xms256M -Xmn128M -Drocketmq.namesrv.addr=rmqnamesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
  vault:
    image: hashicorp/vault:${VAULT_VERSION:-latest}
    volumes:
      - ${DATA_PATH_HOST}/vault/config:/vault/config:rw
      - ${DATA_PATH_HOST}/vault/file:/vault/file:rw
      - ${DATA_PATH_HOST}/vault/logs:/vault/logs
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": [{"tcp": { "address": "0.0.0.0:8300", "tls_disable": true}}], "default_lease_ttl": "168h", "max_lease_ttl": "7200h", "ui": true}'
    restart: always
    ports:
      - 8300:8300
    command: server
    networks:
      - backend
  # Neo4j 替代
  memgraph:
    cpus: 0.1
    mem_limit: 600m  
    image: memgraph/memgraph-platform:latest
    container_name: memgraph_platform
    ports:
      - "7687:7687"
      - "3000:3000"
    environment:
      MEMGRAPH_HOST: 0.0.0.0
    volumes:
      - ${DATA_PATH_HOST}/memgraph/data:/var/lib/memgraph

### Apache Flink ########################################
  flink-jobmanager:
    cpus: 0.1
    mem_limit: 300m  
    image: flink:${FLINK_VERSION:-latest}
    container_name: flink_jobmanager
    ports:
      - "${FLINK_JOBMANAGER_WEB_PORT:-8081}:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ${DATA_PATH_HOST}/flink/jobmanager:/opt/flink/log
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    networks:
      - backend
      - frontend

  flink-taskmanager:
    cpus: 0.1
    mem_limit: 400m  
    image: flink:${FLINK_VERSION:-latest}
    container_name: flink_taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: ${FLINK_TASKMANAGER_REPLICAS:-1}
    environment:
      - | 
        FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASKMANAGER_SLOTS:-2}
    volumes:
      - ${DATA_PATH_HOST}/flink/taskmanager:/opt/flink/log
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    networks:
      - backend

  ### Flink SQL Gateway ####################################
  flink-sql-gateway:
    cpus: 0.1
    mem_limit: 300m  
    image: flink:${FLINK_VERSION:-latest}
    container_name: laradock_flink_sql_gateway
    command: |
      bash -c '
        /opt/flink/bin/sql-gateway.sh start-foreground
      '
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager\n
        rest.address: flink-jobmanager\n
        rest.port: 8081\n
        sql-gateway.endpoint.rest.address: 0.0.0.0\n
        sql-gateway.endpoint.rest.port: 8083
    ports:
      - "${FLINK_SQL_GATEWAY_PORT:-8083}:8083"
    depends_on:
      - flink-jobmanager
    volumes:
      - ${DATA_PATH_HOST}/flink/sql-gateway:/opt/flink/log
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    networks:
      - backend

  ### Apache Spark ########################################
  spark-master:
    cpus: 0.1
    mem_limit: 300m
    image: bitnami/spark:${SPARK_VERSION:-latest}
    container_name: laradock_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "${SPARK_MASTER_WEB_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - ${DATA_PATH_HOST}/spark:/bitnami/spark
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    networks:
      - backend

  spark-worker:
    cpus: 0.1
    mem_limit: 400m  
    image: bitnami/spark:${SPARK_VERSION:-latest}
    container_name: laradock_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-1G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-1}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    depends_on:
      - spark-master
    volumes:
      - ${DATA_PATH_HOST}/spark:/bitnami/spark
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    networks:
      - backend
    links:
      - docker-in-docker
  ### Spark SQL ############################################
  spark-sql:
    cpus: 0.1
    mem_limit: 300m
    image: bitnami/spark:${SPARK_VERSION:-latest}
    container_name: laradock_spark_sql
    command: |
      bash -c '
        /opt/bitnami/spark/bin/spark-sql \
          --master spark://spark-master:7077 \
          --conf spark.sql.warehouse.dir=/opt/bitnami/spark/warehouse \
          --conf spark.sql.catalogImplementation=hive
      '
    environment:
      - SPARK_MODE=client
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    depends_on:
      - spark-master
    volumes:
      - ${DATA_PATH_HOST}/spark/sql:/opt/bitnami/spark/warehouse
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    networks:
      - backend
    stdin_open: true
    tty: true

  ### Hadoop NameNode ####################################
  hadoop-namenode:
    cpus: 0.1
    mem_limit: 300m
    image: bde2020/hadoop-namenode:${HADOOP_VERSION:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-namenode
    restart: always
    ports:
      - "${HADOOP_NAMENODE_WEB_PORT:-9870}:9870"
      - "${HADOOP_NAMENODE_PORT:-9000}:9000"
    volumes:
      - ${DATA_PATH_HOST}/hadoop/namenode:/hadoop/dfs/name
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
      - CORE_CONF_io_compression_codecs=org.apache.hadoop.io.compress.SnappyCodec
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_nameservices=ClusterX
    networks:
      - backend

  ### Hadoop DataNode ####################################
  hadoop-datanode:
    cpus: 0.1
    mem_limit: 300m
    image: bde2020/hadoop-datanode:${HADOOP_VERSION:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-datanode
    restart: always
    volumes:
      - ${DATA_PATH_HOST}/hadoop/datanode:/hadoop/dfs/data
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    environment:
      - SERVICE_PRECONDITION=hadoop-namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
      - CORE_CONF_io_compression_codecs=org.apache.hadoop.io.compress.SnappyCodec
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    depends_on:
      - hadoop-namenode
    networks:
      - backend

  ### Hadoop ResourceManager ############################
  hadoop-resourcemanager:
    cpus: 0.1
    mem_limit: 300m
    image: bde2020/hadoop-resourcemanager:${HADOOP_VERSION:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-resourcemanager
    restart: always
    ports:
      - "${HADOOP_RESOURCEMANAGER_WEB_PORT:-8088}:8088"
    environment:
      - SERVICE_PRECONDITION=hadoop-namenode:9000 hadoop-namenode:9870 hadoop-datanode:9864
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
      - CORE_CONF_io_compression_codecs=org.apache.hadoop.io.compress.SnappyCodec
      - YARN_CONF_yarn_log___aggregation___enable=true
      - YARN_CONF_yarn_log_server_url=http://hadoop-historyserver:8188/applicationhistory/logs/
      - YARN_CONF_yarn_resourcemanager_recovery_enabled=true
      - YARN_CONF_yarn_resourcemanager_store_class=org.apache.hadoop.yarn.server.resourcemanager.recovery.FileSystemRMStateStore
      - YARN_CONF_yarn_resourcemanager_hostname=hadoop-resourcemanager
      - YARN_CONF_yarn_resourcemanager_address=hadoop-resourcemanager:8032
      - YARN_CONF_yarn_resourcemanager_scheduler_address=hadoop-resourcemanager:8030
      - YARN_CONF_yarn_resourcemanager_resource__tracker_address=hadoop-resourcemanager:8031
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    depends_on:
      - hadoop-namenode
      - hadoop-datanode
    networks:
      - backend

  ### Hadoop NodeManager ################################
  hadoop-nodemanager:
    cpus: 0.1
    mem_limit: 300m
    image: bde2020/hadoop-nodemanager:${HADOOP_VERSION:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-nodemanager
    restart: always
    environment:
      - SERVICE_PRECONDITION=hadoop-namenode:9000 hadoop-namenode:9870 hadoop-datanode:9864 hadoop-resourcemanager:8088
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
      - CORE_CONF_io_compression_codecs=org.apache.hadoop.io.compress.SnappyCodec
      - YARN_CONF_yarn_log___aggregation___enable=true
      - YARN_CONF_yarn_log_server_url=http://hadoop-historyserver:8188/applicationhistory/logs/
      - YARN_CONF_yarn_resourcemanager_recovery_enabled=true
      - YARN_CONF_yarn_resourcemanager_store_class=org.apache.hadoop.yarn.server.resourcemanager.recovery.FileSystemRMStateStore
      - YARN_CONF_yarn_resourcemanager_hostname=hadoop-resourcemanager
      - YARN_CONF_yarn_resourcemanager_address=hadoop-resourcemanager:8032
      - YARN_CONF_yarn_resourcemanager_scheduler_address=hadoop-resourcemanager:8030
      - YARN_CONF_yarn_resourcemanager_resource__tracker_address=hadoop-resourcemanager:8031
      - YARN_CONF_yarn_nodemanager_aux___services=mapreduce_shuffle
      - YARN_CONF_yarn_nodemanager_aux___services_mapreduce__shuffle_class=org.apache.hadoop.mapred.ShuffleHandler
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    depends_on:
      - hadoop-namenode
      - hadoop-datanode
      - hadoop-resourcemanager
    networks:
      - backend

  ### MQTT Broker (Eclipse Mosquitto) ###################
  mqtt:
    cpus: 0.05
    mem_limit: 300m
    image: eclipse-mosquitto:${MQTT_VERSION:-latest}
    container_name: mqtt-broker
    restart: always
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ${DATA_PATH_HOST}/mosquitto/data:/mosquitto/data
      - ${DATA_PATH_HOST}/mosquitto/log:/mosquitto/log
      - ${DATA_PATH_HOST}/mosquitto/config:/mosquitto/config:ro
      # - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    networks:
      - backend
      - frontend
  rustfs: # replace minio
    image: rustfs/rustfs:latest  # 使用官方 RustFS 镜像
    container_name: rustfs  # 容器名称，与文档示例保持一致
    restart: always  # 服务故障时自动重启，增强稳定性
    ports:
      - "${RUSTFS_PORT:-9000}:9000"  # 映射宿主机 9000 端口到容器，与文档默认端口一致
    volumes:
      # 数据卷挂载：宿主机路径持久化存储 RustFS 数据
      - ${DATA_PATH_HOST}/rustfs/data:/data  
      # 可选：若启用 TLS，需挂载证书目录（取消注释并修改路径）
      # - /path/to/host/certs:/opt/tls  
      # 可选：挂载宿主机配置文件（若使用外部 config.toml 而非环境变量）
      # - /etc/rustfs/config.toml:/etc/rustfs/config.toml  
    environment:
      # 基础认证配置（文档示例默认值）
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}  
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}  
      # 服务监听地址（容器内端口，与 ports 映射一致）
      - RUSTFS_ADDRESS=${RUSTFS_ADDRESS:-":9000"}  
      # 启用管理控制台（文档推荐开启）
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-true}  
      # 可选：配置服务域名（根据实际需求修改）
      # - RUSTFS_SERVER_DOMAINS=example.com  
      # 可选：TLS 证书路径（若启用 TLS，需与 volumes 挂载路径对应）
      # - RUSTFS_TLS_PATH=/opt/tls  
    command: /data  # 必需参数：指定数据存储路径（与 volumes 容器内路径一致）
    networks:
      - backend
      - frontend
  ### typesense ###################
  typesense: # [search]
    image: typesense/typesense:0.25.2
    restart: always
    ports:
      - "8108:8108"
    volumes:
      - ${DATA_PATH_HOST}/typesense/data:/data
    command: '--data-dir /data --api-key=xyz --enable-cors'
    networks:
      - backend
      - frontend
  ### vespa 单节点 ###################
  vespa: # [search]
    restart: always
    image: vespaengine/vespa  
    container_name: vespa
    hostname: vespa-container
    ports:
      - "8080:8080"  # 查询和Feed接口
      - "19071:19071"  # 配置服务器端口
    environment:
      - VESPA_CONFIGSERVERS=vespa-container
      # - VESPA_CONFIG_URL=http://localhost:19071  # 可选：自定义配置 URL
    volumes:
      - ${DATA_PATH_HOST}/vespa/var:/opt/vespa/var  # 持久化数据存储
      - ${DATA_PATH_HOST}/vespa-/ogs:/opt/vespa/logs  # 日志存储
    # 以下配置推荐用于生产环境
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 32768
        hard: 32768
    # 如果使用Docker，设置为-1；如果使用Podman，设置为0
    pid: host
    networks:
      - backend
      - frontend
    healthcheck:  # 可选：健康检查
      test: ["CMD", "curl", "-f", "http://localhost:19071/ApplicationStatus"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_add:  # 授予必要的权限（Vespa 需要）
      - SYS_PTRACE

  ### xapian PDF服务器 ###################
  xapian: # [search]
    image: kkaffes/xapian-server:latest  # 替换为具体版本如 :1.4.24 如果可用；或使用 remynoulin/xapian-omega-alp:latest
    container_name: xapian-server
    hostname: xapian-host  # 设置容器主机名，便于内部配置
    ports:
      - "8080:8080"  # Omega HTTP 接口（用于搜索查询）
    volumes:  # 生产环境推荐：持久化索引数据
      - ${DATA_PATH_HOST}/xapian/data:/var/lib/xapian  # 持久化 Xapian 数据库和索引
      - ${DATA_PATH_HOST}/xapian/logs:/var/log/xapian  # 持久化日志（如果镜像支持）
    environment:
      - XAPIAN_DB_PATH=/var/lib/xapian/db  # 可选：自定义数据库路径
      - OMEGA_PORT=8080  # 可选：自定义 Omega 端口
    restart: unless-stopped  # 自动重启策略
    healthcheck:  # 可选：健康检查，确保服务就绪
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
      - frontend
  ###   sphinx ###################
  sphinx: # [search]
    image: jc21/sphinxsearch:latest  # 替换为 :3.6.0 或其他版本；备选: macbre/sphinxsearch:latest
    container_name: sphinx-search
    hostname: sphinx-host  # 设置容器主机名，便于内部配置
    ports:
      - "9312:9312"  # Sphinx 查询端口 (searchd)
      - "9306:9306"  # MySQL 协议端口 (用于 SQL-like 查询)
    volumes:  # 生产环境推荐：持久化配置、索引和日志
      - ${DATA_PATH_HOST}/sphinx/conf/sphinx.conf:/etc/sphinxsearch/sphinx.conf:ro  # 映射您的 sphinx.conf 文件（必需）
      - ${DATA_PATH_HOST}/sphinx/data:/var/lib/sphinxsearch  # 持久化索引数据
      - ${DATA_PATH_HOST}/sphinx/logs:/var/log/sphinxsearch  # 持久化日志
      - ${DATA_PATH_HOST}/sphinx/run:/var/run/sphinxsearch  # 持久化运行时文件
    environment:
      - SPHINX_MEM_LIMIT=512m  # 可选：设置内存限制（匹配 sphinx.conf 中的 indexer.mem_limit）
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "searchd", "--status"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: searchd --nodetach
    networks:
      - backend
  ###   pinecone ###################
  pinecone: # [search]
    image: ghcr.io/pinecone-io/pinecone-local:latest
    container_name: pinecone
    hostname: pinecone
    environment:
      PORT: 5080
      PINECONE_HOST: pinecone
    ports:
      - "5080:5080"
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
  # 密集向量索引
  pinecone-dense-index:
    image: ghcr.io/pinecone-io/pinecone-index:latest
    container_name: dense-index
    depends_on:
      pinecone:
        condition: service_healthy
    environment:
      PINECONE_HOST: pinecone
      PINECONE_PORT: 5081
      INDEX_NAME: rag-index
      DIMENSION: 768
      METRIC: cosine
      VECTOR_TYPE: dense
    ports:
      - "5081:5081"
    platform: linux/amd64
    networks:
      - backend
  # RAG 应用服务（示例）
  pinecone-rag-app:
    build:
      context: .
      dockerfile: ./pinecone/Dockerfile  # [TODO]
    container_name: rag-app
    depends_on:
      pinecone-dense-index:
        condition: service_started
    environment:
      PINECONE_API_KEY: "dummy-key-for-local"  # Local不需要真实密钥
      PINECONE_HOST: "http://pinecone:5080"
      PINECONE_INDEX_NAME: "rag-index"
    ports:
      - "8000:8000"
    networks:
      - backend
    volumes:
      - ${DATA_PATH_HOST}/pinecone_rag/app/documents:/app/documents
      - ${DATA_PATH_HOST}pinecone_rag/app//data:/app/data
  ###   qdrant ###################
  qdrant: # [search][向量]
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - ${DATA_PATH_HOST}/qdrant/storage:/qdrant/storage
      - ${DATA_PATH_HOST}/qdrant/config:/qdrant/config
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
      - QDRANT__STORAGE__PERFORMANCE__OPTIMIZERS__MEMMAP_THRESHOLD_KB=10240
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
  ###   xxljob ###################
  xxljob: # [任务调度]
    image: xuxueli/xxl-job-admin:${XXLJOB_VERSION:-2.3.1}
    container_name: laradock-xxljob
    restart: always
    ports:
      - "${XXLJOB_PORT:-8800}:8080"
    environment:
      - PARAMS=--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD} --xxl.job.accessToken=${XXLJOB_ACCESS_TOKEN:-default_token}
      - TZ=${WORKSPACE_TIMEZONE}
    volumes:
      - xxljob:/data/applogs
    depends_on:
      - mysql
    networks:
      - backend
###   etcd ###################
  etcd:
    image: quay.io/coreos/etcd:${ETCD_VERSION:-latest}
    container_name: milvus-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DATA_PATH_HOST}/etcd/data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - backend
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
  ###   milvus ###################
  milvus-standalone: # [search][向量]
    image: milvusdb/milvus:${MILVUS_VERSION:-latest}
    container_name: milvus-standalone
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_PATH_HOST}/milvus/data:/var/lib/milvus
      - ${DATA_PATH_HOST}/milvus/conf/milvus.yaml:/milvus/configs/milvus.yaml
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # Metrics
    networks:
      - backend
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # 可选：Attu - Milvus GUI管理工具
  milvus-attu:
    image: zilliz/attu:${ATTU_VERSION:-latest}
    container_name: milvus-attu
    restart: always
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      - milvus-standalone
  ###   postgres-vector ###################
  postgres-vector: # [TODO]
    image: pgvector/pgvector:${PGVECOR_VERSION:-pg16}
    container_name: postgres-vector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vectordb
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=vector"
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_PATH_HOST}/postgres-vector/data:/var/lib/postgresql/data
      - ${APP_CODE_PATH_HOST}/postgres-vector/init-scripts:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c work_mem=16MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectoruser -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

  # 初始化脚本示例
  # init-scripts/init.sql:
  # CREATE EXTENSION IF NOT EXISTS vector;
  # CREATE TABLE items (
  #   id SERIAL PRIMARY KEY,
  #   embedding vector(768),
  #   metadata JSONB
  # );
  # CREATE INDEX ON items USING hnsw (embedding vector_cosine_ops);

  # 可选：pgAdmin 管理界面
  
  ###   weaviate ###################
  weaviate: # [search][矢量]
    image: semitechnologies/weaviate:${WEAVIATE_VERSION:-latest}
    container_name: weaviate
    restart: on-failure:0
    ports:
      - "8080:8080"
      - "50051:50051"  # gRPC port
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai,text2vec-cohere,text2vec-huggingface,generative-openai,generative-cohere,qna-openai,ref2vec-centroid'
      CLUSTER_HOSTNAME: 'node1'
      # OpenAI 配置（如果使用）
      OPENAI_APIKEY: ${OPENAI_API_KEY:-your-api-key}
      # 性能优化
      GOMAXPROCS: 8
      PERSISTENCE_LSM_ACCESS_STRATEGY: 'mmap'
      LIMIT_RESOURCES: 'false'
      # 监控
      PROMETHEUS_MONITORING_ENABLED: 'true'
    volumes:
      - ${DATA_PATH_HOST}/weaviate/data:/var/lib/weaviate
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：Weaviate Console（Web UI）
  weaviate-console:
    image: semitechnologies/weaviate-console:${WEAVIATE_CONSOLE_VERSION:-latest}
    container_name: weaviate-console
    restart: always
    ports:
      - "8081:80"
    environment:
      WEAVIATE_HOST: "weaviate:8080"
      WEAVIATE_SCHEME: "http"
    depends_on:
      - weaviate    
    networks:
      - backend

  ###   chroma ###################    
  chroma: # [search][矢量]
    image: chromadb/chroma:${CHROMA_VERSION:-latest}
    container_name: chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${DATA_PATH_HOST}/chroma/data:/chroma/chroma
      - ${DATA_PATH_HOST}/chroma/config:/chroma/config
    environment:
      - CHROMA_SERVER_AUTH_PROVIDER=${CHROMA_SERVER_AUTH_PROVIDER:-chromadb.auth.token.TokenAuthServerProvider}
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_SERVER_AUTH_CREDENTIALS:-test-token}
      - CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER=${CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER:-AUTHORIZATION}
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_OTEL_EXPORTER_ENDPOINT=${CHROMA_OTEL_EXPORTER_ENDPOINT:-}
      - CHROMA_OTEL_EXPORTER_HEADERS=${CHROMA_OTEL_EXPORTER_HEADERS:-}
      - CHROMA_OTEL_SERVICE_NAME=${CHROMA_OTEL_SERVICE_NAME:-chromadb}
      - CHROMA_OTEL_GRANULARITY=${CHROMA_OTEL_GRANULARITY:-all}
      - CHROMA_SERVER_NOFILE_LIMIT=65535
    command: uvicorn chromadb.app:app --reload --workers 1 --host 0.0.0.0 --port 8000 --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ###   seata ###################
  seata:
    image: seataio/seata-server:${SEATA_VERSION:-latest}
    environment:
      - LOGGING_FILE_PATH=/seata-server/logs    (default= /root/logs/seata)
      - TZ=Asia/Shanghai
      # - SEATA_IP=<auto-detect>
      - SEATA_PORT=${SEATA_PORT}
      # - STORE_MODE=db  应该从nacos读取配置
      - SEATA_CONSOLE_ENABLED=false
      # 注册中心 & 配置中心（Nacos，带鉴权）
      - SEATA_REGISTRY_TYPE=${SEATA_REGISTRY_TYPE}
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=${SEATA_REGISTRY_NACOS_SERVER_ADDR}
      - SEATA_REGISTRY_NACOS_NAMESPACE=${SEATA_REGISTRY_NACOS_NAMESPACE}
      - SEATA_REGISTRY_NACOS_GROUP=${SEATA_REGISTRY_NACOS_GROUP}
      - SEATA_REGISTRY_NACOS_APPLICATION=${SEATA_REGISTRY_NACOS_APPLICATION}
      - SEATA_REGISTRY_NACOS_CLUSTER=${SEATA_REGISTRY_NACOS_CLUSTER}
      - SEATA_REGISTRY_NACOS_USERNAME=${SEATA_REGISTRY_NACOS_USERNAME}
      - SEATA_REGISTRY_NACOS_PASSWORD=${SEATA_REGISTRY_NACOS_PASSWORD}
      - SEATA_CONFIG_TYPE=${SEATA_CONFIG_TYPE}
      - SEATA_CONFIG_NACOS_SERVER_ADDR=${SEATA_CONFIG_NACOS_SERVER_ADDR}
      - SEATA_CONFIG_NACOS_NAMESPACE=${SEATA_CONFIG_NACOS_NAMESPACE}
      - SEATA_CONFIG_NACOS_GROUP=${SEATA_CONFIG_NACOS_GROUP}
      - SEATA_CONFIG_NACOS_USERNAME=${SEATA_CONFIG_NACOS_USERNAME}
      - SEATA_CONFIG_NACOS_PASSWORD=${SEATA_CONFIG_NACOS_PASSWORD}
    volumes:
      - "./seata-server/ver/${SEATA_VERSION}/resources/application.yml:/seata-server/resources/application.yml"
      - "./seata-server/logs:/seata-server/logs"
      # 1.x 需要mysql 驱动8.x,新版本格式,com.mysql.cj.jdbc.Driver.
      # - "./mysql/libs/mysql-connector-j-8.0.33.jar:/seata-server/libs/mysql-connector-j-8.0.33.jar:ro"
    ports:
      - "${SEATA_CONSOLE_PORT:-7091}:7091"
      - "${SEATA_PORT:-8091}:8091"
    depends_on:
      - mysql
      - nacos
    networks:
      - backend
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    restart: unless-stopped
