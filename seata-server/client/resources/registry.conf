registry {
  # file 、nacos 、eureka、redis、zk、consul、etcd3、sofa
  type = "nacos"
  nacos {
    # 查找的seata服务
    application = "seata-server"
    # 注册到nacos的seata服务连接地址
    serverAddr = "nacos:8848"
    # nacos的namespace
    namespace = "bbz-testing"
    username = "nacos"
    password = "nacos"
  }
}

config {
  # file、nacos 、apollo、zk、consul、etcd3、springCloudConfig
  type = "nacos"
  nacos {
    serverAddr = "nacos:8848"
    namespace = "bbz-testing"
    group = "SEATA_GROUP"
    username = "nacos"
    password = "nacos"
  }
}
