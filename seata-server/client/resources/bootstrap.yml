spring:
  application:
    name: mp-pay-service
  profiles:
    active: testing
  cloud:
    nacos:
      config:
        server-addr: ${nacos.config.server:nacos:8848}
        shared-configs:
          - refresh: true
            data-id: config-common.properties
        refresh: true
            data-id: seataClient.properties
